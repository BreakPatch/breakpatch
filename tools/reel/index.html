<!doctype html>
<html><head><meta charset="utf-8"><title>Breakpatch — Product Reel</title>
<style>
@font-face{font-family:"Brico";font-weight:400;src:url(fonts/bricolage-grotesque-latin-400-normal.woff2)}
@font-face{font-family:"Brico";font-weight:500;src:url(fonts/bricolage-grotesque-latin-500-normal.woff2)}
@font-face{font-family:"Brico";font-weight:600;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2)}
@font-face{font-family:"Brico";font-weight:700;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2)}
@font-face{font-family:"Mono";font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2)}
@font-face{font-family:"Mono";font-weight:600;src:url(fonts/jetbrains-mono-latin-600-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ============================================================
   BREAKPATCH — 30s product reel. Every frame is a pure function
   of time: draw(t). 120 BPM (beat = 0.5s, bar = 2s).
   Brand tokens, copy and product facts come from the BreakPatch
   repos (site.css, README, landing page).
   ============================================================ */
const W=1920,H=1080,CX=960,CY=540;
const C={bg:'#171412',sunk:'#100D0B',surface:'#211C19',raised:'#2C2521',line:'#3A322C',line2:'#4A3F37',
  text:'#F6EFE9',text2:'#E9DFD6',muted:'#CFC4BA',faint:'#A3978C',accent:'#E0714A',accentD:'#B8502D',onAccent:'#1A0E08',
  cream:'#FBF7F3',creamR:'#F3ECE5',creamL:'#E6DCD2',ink:'#221A15',ok:'#8FD17A',bad:'#F0645A',
  app:'#4C6FFF',appInk:'#1B2230'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const g0=off.getContext('2d');
const tint=document.createElement('canvas');tint.width=W;tint.height=H;const tctx=tint.getContext('2d');
const winCv=document.createElement('canvas');winCv.width=1100;winCv.height=748;const winCtx=winCv.getContext('2d');
let g=g0,T=0,RT=0,DUR=30;
/* ---- cuts: a recipe plays segments of the master timeline (0-42), with holds (a state held on screen) ---- */
const CRAWL=0.04;                       // during a hold the scene still creeps forward at 4% speed
let TL=[],SEAMS=[];
function setCut(rec){TL=[];SEAMS=[];let c=0;
  rec.segments.forEach(([m0,m1],si)=>{
    if(si>0&&Math.abs(rec.segments[si-1][1]-m0)>1e-6)SEAMS.push(c);
    const hs=(rec.holds||[]).filter(h=>h[0]>=m0&&h[0]<m1).sort((a,b)=>a[0]-b[0]);let cur=m0;
    hs.forEach(([hm,shift])=>{const d=shift/(1-CRAWL);if(hm>cur+1e-9){TL.push({c0:c,c1:c+(hm-cur),m0:cur,m1:hm,hold:false});c+=hm-cur}
      const end=hm+CRAWL*d;TL.push({c0:c,c1:c+d,m0:hm,m1:end,hold:true});c+=d;cur=end});
    TL.push({c0:c,c1:c+(m1-cur),m0:cur,m1:m1,hold:false});c+=m1-cur});
  DUR=c}
function cutMap(rt){let e=TL[TL.length-1];for(const x of TL){if(rt<x.c1){e=x;break}}const p=clamp((rt-e.c0)/Math.max(1e-9,e.c1-e.c0));return{m:e.m0+(e.m1-e.m0)*p,hold:e.hold}}
setCut({segments:[[0,30]],holds:[]});
function withCtx(c,fn){const o=g;g=c;fn();g=o}

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const E={out3:x=>1-Math.pow(1-x,3),outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  io3:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,outBack:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const kick=t=>Math.exp(-((t*2)%1)*5.5);
const impacts={2.0:1,6.0:1,8.0:.5,12.0:.35,14.0:.4,18.0:.5,19.75:.6,20.0:.35,22.0:.5,24.0:.4,26.0:1,28.6:.25,30.0:.5,34.0:.5,36.0:.5,38.5:.4};
function impactAt(t){let a=0;for(const k in impacts){const d=t-+k;if(d>=0&&d<1.2)a=Math.max(a,impacts[k]*Math.exp(-d*9))}return a}

/* ---------- helpers ---------- */
function txt(s,x,y,o={}){const{size=40,font='Brico',weight=700,color=C.text,align='left',ls=0,alpha=1,stroke=null,sw=2}=o;
  g.save();g.font=`${weight} ${size}px ${font}`;g.letterSpacing=ls+'px';g.textAlign=align;g.textBaseline='alphabetic';g.globalAlpha*=alpha;
  if(stroke){g.strokeStyle=stroke;g.lineWidth=sw;g.lineJoin='round';g.strokeText(s,x,y)}else{g.fillStyle=color;g.fillText(s,x,y)}g.restore()}
function tw(s,size,font='Brico',weight=700,ls=0){g.save();g.font=`${weight} ${size}px ${font}`;g.letterSpacing=ls+'px';const w=g.measureText(s).width;g.restore();return w}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function fillRR(x,y,w,h,r,col,alpha=1){g.save();g.globalAlpha*=alpha;rr(x,y,w,h,r);g.fillStyle=col;g.fill();g.restore()}
function strokeRR(x,y,w,h,r,col,lw=1.5,alpha=1){g.save();g.globalAlpha*=alpha;rr(x,y,w,h,r);g.strokeStyle=col;g.lineWidth=lw;g.stroke();g.restore()}
function maskLine(s,x,y,size,t0,dur,o={},ex=null,exd=.3){const p=E.outExpo(pr(T,t0,t0+dur)),pe=ex?E.inExpo(pr(T,ex,ex+exd)):0;if(p<=0||pe>=1)return;
  g.save();g.beginPath();g.rect(0,y-size*.95,W,size*1.25);g.clip();txt(s,x,y+(1-p)*size*1.2-pe*size*1.2,{size,...o});g.restore()}
function glow(x,y,r,rgb,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
const EMB='224,113,74';
function dotGrid(col,alpha,sp=64,speed=3,amp=2.2,cx=CX,cy=CY){g.save();g.fillStyle=col;
  for(let y=sp/2;y<H;y+=sp)for(let x=sp/2;x<W;x+=sp){const d=Math.hypot(x-cx,y-cy);const w=Math.max(0,Math.sin(d*.012-RT*speed));
    g.globalAlpha=alpha*(.35+.65*w);g.beginPath();g.arc(x,y,1.1+amp*w*w*w*Math.exp(-d/1400),0,6.2832);g.fill()}g.restore()}
/* the ear mark (Mora's ear) — exact path from site/assets/favicon.svg */
const EAR=new Path2D('M16 4h9.5A2.5 2.5 0 0 1 28 6.5V16A12 12 0 1 1 16 4Z');
function ear(x,y,s,rot=-14,fill=C.accent,alpha=1){g.save();g.translate(x,y);g.rotate(rot*Math.PI/180);g.scale(s,s);g.translate(-16,-16);g.globalAlpha*=alpha;g.fillStyle=fill;g.fill(EAR);g.restore()}
/* wordmark: "break" bold + "patch" regular, letters rise on a stagger */
function wordmark(cx,base,size,t0,col=C.text,col2=C.text,ls=-0.02){
  const A='break',B='patch',fa=`700 ${size}px Brico`,fb=`400 ${size}px Brico`;
  g.save();g.letterSpacing=(ls*size)+'px';const wa=[...A].map(c=>{g.font=fa;return g.measureText(c).width}),wb=[...B].map(c=>{g.font=fb;return g.measureText(c).width});g.restore();
  const total=wa.reduce((a,b)=>a+b,0)+wb.reduce((a,b)=>a+b,0);let x=cx-total/2;
  [...A+B].forEach((ch,i)=>{const isA=i<5,w=isA?wa[i]:wb[i-5];const p=E.outExpo(pr(T,t0+i*.045,t0+.65+i*.045));
    g.save();g.beginPath();g.rect(x-20,base-size*.95,w+40,size*1.3);g.clip();
    txt(ch,x,base+(1-p)*size*1.1,{size,weight:isA?700:400,color:isA?col:col2,ls:ls*size});g.restore();x+=w})}
function cursor(x,y,a=1,s=1){g.save();g.translate(x,y);g.scale(s,s);g.globalAlpha*=a;g.fillStyle='#fff';g.strokeStyle='#14100E';g.lineWidth=2;g.lineJoin='round';
  g.beginPath();g.moveTo(0,0);g.lineTo(0,30);g.lineTo(8,23);g.lineTo(14,36);g.lineTo(19,34);g.lineTo(13,22);g.lineTo(23,22);g.closePath();g.fill();g.stroke();g.restore()}
function ripple(x,y,t0,col=C.accent,R=60){const p=pr(T,t0,t0+.55);if(p<=0||p>=1)return;g.save();g.strokeStyle=col;g.globalAlpha=(1-p)*.9;g.lineWidth=3;g.beginPath();g.arc(x,y,E.outExpo(p)*R,0,6.28);g.stroke();g.restore()}
function chip(s,x,y,o={}){const{size=22,pad=18,h=48,bg=C.surface,bd=C.line2,col=C.text,dot=C.accent,alpha=1,scale=1}=o;
  const w=tw(s,size,'Brico',600)+pad*2+24;g.save();g.translate(x+w/2,y+h/2);g.scale(scale,scale);g.translate(-w/2,-h/2);g.globalAlpha*=alpha;
  fillRR(0,0,w,h,h/2,bg);strokeRR(0,0,w,h,h/2,bd,1.5);g.save();g.translate(pad+5,h/2);g.rotate(-14*Math.PI/180);fillRR(-6,-6,12,12,5,dot);g.restore();
  txt(s,pad+24,h/2+size*.35,{size,weight:600,color:col});g.restore();return w}

/* ============================================================
   The web app under test ("Paperplane") — drawn in 1000×640 design units
   ============================================================ */
const AP={btnNew:{x:780,y:86,w:160,h:44},input:{x:294,y:276,w:412,h:46}};
function appRects(st){const sw=!!st.swap;return{done:sw?{x:294,y:416,w:120,h:44}:{x:586,y:416,w:120,h:44},cancel:sw?{x:586,y:416,w:120,h:44}:{x:454,y:416,w:112,h:44}}}
function appPage(x,y,sc,st={}){
  g.save();g.translate(x,y);g.scale(sc,sc);g.beginPath();g.rect(0,0,1000,640);g.clip();
  g.fillStyle='#F4F6FB';g.fillRect(0,0,1000,640);
  g.fillStyle='#fff';g.fillRect(0,0,1000,56);g.fillStyle='#E4E8F2';g.fillRect(0,56,1000,1);
  g.fillStyle=C.app;g.beginPath();g.arc(30,28,13,0,6.28);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(24,28);g.lineTo(37,22);g.lineTo(31,35);g.lineTo(29,29);g.closePath();g.fill();
  txt('Paperplane',54,35,{size:20,weight:700,color:C.appInk});
  fillRR(560,14,260,30,15,'#EEF1F8');fillRR(576,24,90,10,5,'#D5DAE8');
  g.fillStyle='#C9D2F0';g.beginPath();g.arc(962,28,15,0,6.28);g.fill();
  g.fillStyle='#fff';g.fillRect(0,57,200,583);g.fillStyle='#E4E8F2';g.fillRect(200,57,1,583);
  ['Projects','Tasks','People','Reports','Settings'].forEach((s,i)=>{const yy=84+i*46;if(i==0)fillRR(14,yy,172,38,10,'#E8EDFF');
    fillRR(28,yy+12,14,14,4,i==0?C.app:'#CBD2E3');txt(s,54,yy+26,{size:16,weight:i==0?600:500,color:i==0?'#3752D6':'#6B7488'})});
  txt('Projects',240,126,{size:32,weight:700,color:C.appInk});txt('3 active, 1 archived',240,152,{size:15,weight:400,color:'#7A8398'});
  const b=AP.btnNew;fillRR(b.x,b.y+(st.pressNew?1:0),b.w,b.h,10,st.hoverNew?'#3A59E0':C.app);txt('New project',b.x+b.w/2,b.y+b.h/2+6,{size:17,weight:600,color:'#fff',align:'center'});
  const names=['Website relaunch','Q3 roadmap','Mobile app'],cols=['#FFD9B8','#CFE3FF','#D9F0D4'];
  const created=st.created?E.outBack(clamp(st.created)):0;
  const items=created>0?[(st.newName||'Launch plan'),...names]:names;
  items.slice(0,created>0?4:3).forEach((n,i)=>{const cx_=240+i*(created>0?182:238),w=created>0?170:226;const isNew=created>0&&i==0;
    g.save();if(isNew){g.translate(cx_+w/2,330);g.scale(created,created);g.translate(-(cx_+w/2),-330)}
    fillRR(cx_,190,w,200,14,'#fff');strokeRR(cx_,190,w,200,14,isNew?C.app:'#E4E8F2',isNew?2:1);
    fillRR(cx_+14,204,w-28,84,10,isNew?'#DCE3FF':cols[(i+ (created>0?3:0))%3]);
    txt(n,cx_+16,324,{size:created>0?16:18,weight:600,color:C.appInk});fillRR(cx_+16,340,w*.5,9,4.5,'#E1E5EF');fillRR(cx_+16,358,w*.3,9,4.5,'#E1E5EF');g.restore()});
  for(let i=0;i<3;i++){fillRR(240,430+i*52,i==1?420:520,36,10,'#fff');strokeRR(240,430+i*52,i==1?420:520,36,10,'#E4E8F2',1);fillRR(256,444+i*52,160,9,4.5,'#E1E5EF')}
  if(st.dialog>0){const d=E.outExpo(st.dialog);g.fillStyle=`rgba(20,26,40,${.55*d})`;g.fillRect(0,0,1000,640);
    g.save();g.translate(500,315);g.scale(.92+.08*d,.92+.08*d);g.translate(-500,-315);g.globalAlpha=d;
    g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=40;g.shadowOffsetY=16;fillRR(270,150,460,350,18,'#fff');g.shadowColor='transparent';
    txt('Create project',294,200,{size:25,weight:700,color:C.appInk});txt("Give it a name you'll recognise.",294,228,{size:15,weight:400,color:'#7A8398'});
    txt('Project name',294,264,{size:14,weight:600,color:'#4A5368'});
    const i=AP.input;fillRR(i.x,i.y,i.w,i.h,10,'#fff');strokeRR(i.x,i.y,i.w,i.h,10,st.focus?C.app:'#D5DAE8',st.focus?2.5:1.5);
    const typed=st.typed||'';if(typed)txt(typed,i.x+16,i.y+30,{size:18,weight:500,color:C.appInk});else txt('e.g. Website relaunch',i.x+16,i.y+30,{size:18,weight:400,color:'#A5ADBF'});
    if(st.focus&&Math.floor(T*2.5)%2==0)fillRR(i.x+16+tw(typed,18,'Brico',500)+2,i.y+12,2,22,1,C.app);
    const r=appRects(st);fillRR(r.cancel.x,r.cancel.y,r.cancel.w,r.cancel.h,10,'#fff');strokeRR(r.cancel.x,r.cancel.y,r.cancel.w,r.cancel.h,10,'#D5DAE8',1.5);
    txt('Cancel',r.cancel.x+r.cancel.w/2,r.cancel.y+29,{size:16,weight:600,color:'#4A5368',align:'center'});
    if(!st.noDone){fillRR(r.done.x,r.done.y+(st.pressDone?1:0),r.done.w,r.done.h,10,C.app);txt('Done',r.done.x+r.done.w/2,r.done.y+29,{size:16,weight:600,color:'#fff',align:'center'})}
    g.restore()}
  if(st.toast>0){const p=E.outBack(st.toast);fillRR(380,600-60*p,240,44,22,C.appInk);g.fillStyle='#6FD58A';g.beginPath();g.arc(406,578-60*p+44,9,0,6.28);g.fill();
    txt('Project created',428,628-60*p,{size:16,weight:600,color:'#fff'})}
  g.restore()}

/* ============================================================
   SCENE A (0–8): the app works → it breaks → shards implode → ear mark
   ============================================================ */
const WX=720,WY=170,WW=1100,WH=748;
const SH=(()=>{const cols=9,rows=6,pts=[];for(let j=0;j<=rows;j++){pts[j]=[];for(let i=0;i<=cols;i++){const jx=(i>0&&i<cols)?(rnd(i*13+j*7)-.5)*.55:0,jy=(j>0&&j<rows)?(rnd(i*17+j*5+3)-.5)*.55:0;
  pts[j][i]=[(i+jx)/cols*WW,(j+jy)/rows*WH]}}
  const tris=[];for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=pts[j][i],b=pts[j][i+1],c=pts[j+1][i+1],d=pts[j+1][i];const diag=rnd(i*3+j*11)>.5;
    const ts=diag?[[a,b,c],[a,c,d]]:[[a,b,d],[b,c,d]];ts.forEach((t,k)=>{const cx=(t[0][0]+t[1][0]+t[2][0])/3,cy=(t[0][1]+t[1][1]+t[2][1])/3;const id=(j*cols+i)*2+k;
      const ang=Math.atan2(cy-WH*.62,cx-WW*.62)+(rnd(id)-.5)*.9;tris.push({t,cx,cy,ang,sp:140+rnd(id+5)*520,om:(rnd(id+9)-.5)*10,lift:(rnd(id+14)-.3)*300,z:rnd(id+2),col:rnd(id+31)})})}
  return tris})();
function windowContent(){
  withCtx(winCtx,()=>{g.clearRect(0,0,WW,WH);g.save();rr(0,0,WW,WH,16);g.clip();
    g.fillStyle='#E9ECF3';g.fillRect(0,0,WW,44);['#FF6159','#FFBD2E','#28C840'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(24+i*22,22,6.5,0,6.28);g.fill()});
    fillRR(WW/2-220,10,440,24,12,'#fff');txt('paperplane.app/projects',WW/2,27,{size:14,weight:500,color:'#6B7488',align:'center',font:'Mono'});
    const u=T;const dlg=E.outExpo(pr(u,.35,.8));const click=pr(u,1.15,1.25);const doneP=u>1.2;
    const st={dialog:dlg,focus:true,typed:'Launch plan'.slice(0,Math.floor(clamp((u-.8)*14,0,11))),pressDone:u>1.2&&u<1.3,toast:u>1.35?pr(u,1.35,1.7):0};
    if(u>1.28){st.dialog=1-E.outExpo(pr(u,1.28,1.55));st.created=pr(u,1.4,1.9);}
    g.save();g.translate(0,44);appPage(0,0,1.1,st);g.restore();
    g.restore();g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=2;rr(1,1,WW-2,WH-2,16);g.stroke()})}
function sceneA(){
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  glow(CX+300,CY,1000,EMB,.10+.04*kick(RT));
  dotGrid(C.text,.16,64,2.4,2);
  if(T<6.0)windowContent();
  // headline
  maskLine('Your app',110,420,128,.3,.7,{color:C.text},1.97,.2);maskLine('works.',110,550,128,.55,.7,{color:C.text},1.97,.2);
  
  txt('01 / THE FRIDAY RELEASE',110,230,{font:'Mono',weight:400,size:22,ls:6,color:C.faint,alpha:pr(T,.4,.9)*(1-pr(T,3.7,3.9))});
  // intact window with float, then shards
  if(T<2.0){
    const p=E.outExpo(pr(T,0,.9));const jit=T>1.72?(rnd(Math.floor(T*40))-.5)*(T-1.72)*34:0;
    g.save();g.globalAlpha=p;g.translate(WX+jit,WY+(1-p)*80);g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=60;g.shadowOffsetY=30;
    g.drawImage(winCv,0,0);g.shadowColor='transparent';
    // cursor clicks Done at 1.2
    const cp=E.io3(pr(T,.7,1.2));const dx=(586+60)*1.1,dy=44+(416+22)*1.1;cursor(lerp(WW*.5,dx,cp),lerp(WH*.9,dy,cp),pr(T,.6,.8));
    ripple(dx,dy,1.2,'#4C6FFF',70);g.restore();
    // cracks
    if(T>1.78){const cp2=E.outExpo(pr(T,1.78,2.0));g.save();g.translate(WX,WY);g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=2.5;g.lineCap='round';
      const ox=WW*.62,oy=WH*.62;for(let k=0;k<11;k++){const a=k/11*6.28+rnd(k)*.5;let x=ox,y=oy;g.beginPath();g.moveTo(x,y);const L=(260+rnd(k+3)*520)*cp2;
        for(let s=1;s<=7;s++){const f=s/7*L;g.lineTo(ox+Math.cos(a)*f+(rnd(k*9+s)-.5)*40,oy+Math.sin(a)*f+(rnd(k*7+s)-.5)*40)}g.stroke()}g.restore()}
  } else if(T<6.0){
    const s=Math.max(0,T-2.0);const q=E.inExpo(pr(T,4.7,6.0));
    SH.forEach(h=>{const ease=(1-Math.exp(-2.1*Math.min(s,2.9)))/2.1;
      let px=h.cx+Math.cos(h.ang)*h.sp*ease,py=h.cy+Math.sin(h.ang)*h.sp*ease+h.lift*ease*.5+40*s*s*.2;
      let rot=h.om*(1-Math.exp(-1.6*Math.min(s,2.9)))/1.6,sc=1+.35*h.z*(1-Math.exp(-s));
      // slow drift while floating
      if(s>2.9){const e2=s-2.9;px+=Math.cos(h.ang)*14*e2;py+=Math.sin(h.ang)*14*e2;rot+=h.om*.04*e2}
      if(q>0){px=lerp(px,CX-WX,q);py=lerp(py,CY-WY,q);sc*=1-q*.97;rot+=q*h.om*.7}
