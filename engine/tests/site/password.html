<!doctype html><html><head><meta charset="utf-8"><title>Password</title></head>
<body style="margin:0;font:18px sans-serif;background:#fff">
  <!-- A password field with the focus, and a line under it. ?other=1: an error shows there instead. -->
  <input id="p" type="password" autofocus style="position:absolute;left:20px;top:20px;width:400px;height:40px;font:18px monospace">
  <div id="hint" style="position:absolute;left:20px;top:70px;width:400px;height:24px">At least 8 characters</div>
  <script>
    if (new URLSearchParams(location.search).get('other')) {        // an error shows under the field
      const h = document.getElementById('hint');
      h.textContent = 'Wrong password'; h.style.cssText += ';background:#c62828;color:#fff;height:40px';
    }
    document.getElementById('p').focus();
  </script>
</body></html>
