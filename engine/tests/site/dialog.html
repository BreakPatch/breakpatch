<!doctype html><html><head><meta charset="utf-8"><title>Dialog</title>
<style>
  body { margin: 0; font: 16px sans-serif; background: #f4f4f4; }
  .tile { position: absolute; width: 180px; height: 120px; border-radius: 8px; }
  #dlg { position: absolute; left: 200px; top: 150px; width: 400px; height: 260px; background: #fff; border-radius: 12px;
         box-shadow: 0 8px 30px rgba(0,0,0,.3); transition: opacity 600ms linear; }
  #dlg h2 { margin: 24px; font-size: 22px; } #dlg p { margin: 0 24px; }
  #x { position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border: 0; border-radius: 16px; background: #ddd; font: 18px sans-serif; }
  #x:hover { background: #bbb; }
</style></head>
<body>
  <!-- A "What's new" dialog over a dashboard. ?bg=2: the dashboard shows other content (the tile by the X stays).
       ?fade=1: the dialog fades out slowly. ?stay=1: the X does nothing. ?partial=1: only the text goes. -->
  <div id="tiles"></div>
  <div id="dlg"><h2>What's new</h2><p>Reports now load twice as fast. Try the new filters on the left.</p><button id="x">×</button></div>
  <script>
    var q = new URLSearchParams(location.search);
    var colors = q.get('bg') === '2' ? ['#1b5e20', '#b71c1c', '#bbdefb', '#e65100', '#4a148c', '#006064'] : ['#c8e6c9', '#ffcdd2', '#bbdefb', '#ffe0b2', '#e1bee7', '#b2ebf2'];
    var at = q.get('bg') === '2' ? [[60, 260], [300, 170], [480, 60], [240, 420], [420, 330], [100, 80]] : [[40, 60], [260, 60], [480, 60], [40, 220], [260, 220], [480, 220]];
    at.forEach(function (p, i) { var d = document.createElement('div'); d.className = 'tile'; d.style.cssText = 'left:' + p[0] + 'px;top:' + p[1] + 'px;background:' + colors[i]; document.getElementById('tiles').appendChild(d); });
    document.getElementById('x').onclick = function () {
      var d = document.getElementById('dlg');
      if (q.get('stay')) return;
      if (q.get('partial')) { d.querySelector('h2').remove(); return; }
      if (q.get('fade')) { d.style.opacity = '0'; setTimeout(function () { d.remove(); }, 650); return; }
      d.remove();
    };
  </script>
</body></html>
