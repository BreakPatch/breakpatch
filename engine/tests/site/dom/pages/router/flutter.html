<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Flutter-like</title></head>
<body style="margin:0">
  <!-- Like a Flutter web app: a host element it draws into, plus a few real buttons it adds for
       its own reasons. The host alone makes the page Visual, whatever else is listed. -->
  <flutter-view style="display:block;position:absolute;inset:0">
    <flt-glass-pane style="display:block;width:100%;height:100%"></flt-glass-pane>
  </flutter-view>
  <div style="position:absolute;left:20px;top:20px">
    <button>Sign in</button> <button>Help</button> <button>Menu</button>
  </div>
</body></html>
