name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Community edition only: the private Team module (Breakpatch/breakpatch-team) is not checked
# out here, so the app builds without app/src/edition/team and the engine without
# breakpatch_team_engine. The Team repo's own CI tests both together. One exception, the
# ci-command job: it builds breakpatch-ci's wheels as a release does (scripts/build-ci.sh, Linux,
# a throwaway licence key) and tries them in a clean Python environment. It needs the Team repo,
# so it only runs where the secret TEAM_CI_TOKEN is available (pushes and pull requests from this
# repository, not from forks) and otherwise says why it skipped.
#
# Coverage: the ui, engine and shell jobs each report a line coverage total. On pushes to main the
# badges job writes them as shields.io endpoint files to the orphan branch `badges`
# (.github/scripts/publish-badges.sh), which the README's coverage badges read. No third-party
# service or token; that job alone may write to the repo.

jobs:
  ui:
    name: UI (typecheck, build, tests)
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # No install scripts (security review S2); the build and tests don't need any.
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npx vite build
      - name: Tests (with coverage)
        id: tests
        run: |
          npx vitest run --coverage
          echo "coverage=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")" >> "$GITHUB_OUTPUT"

  engine:
    name: Engine (pytest)
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
    defaults:
      run:
        working-directory: engine
    env:
      # One place for Playwright's Chromium, used by both the install and the tests.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/locks/linux-x86_64.dev.txt
      # From the hashed lock (security review S3; scripts/lock-python.sh writes it), then the
      # engine itself without dependencies. pip check fails if the lock misses one.
      - name: Install the engine
        run: |
          python -m pip install --require-hashes -r locks/build.txt
          python -m pip install --require-hashes --no-build-isolation -r locks/linux-x86_64.dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Tests (with coverage)
        id: tests
        run: |
          python -m pytest -q --cov --cov-report=term
          echo "coverage=$(python -m coverage report --format=total --precision=1)" >> "$GITHUB_OUTPUT"

  # The engine's tests on Windows and Linux arm64 (plan P0.4). Manual runs only (Actions → CI →
  # Run workflow): they don't run on pushes or pull requests, so they cost no minutes until asked.
  engine-platforms:
    name: Engine (pytest) on ${{ matrix.platform }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: windows-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: engine
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the engine
        run: |
          python -m pip install --require-hashes -r locks/build.txt
          python -m pip install --require-hashes --no-build-isolation -r "locks/${{ matrix.platform }}.dev.txt"
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m pytest -q

  shell:
    name: Tauri shell (cargo check, clippy, test)
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: WebKit and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential patchelf
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.98.1
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov
      # tauri-build requires every externalBin to exist; the placeholder is enough to compile.
      - name: Placeholder engine sidecar
        run: sh ../scripts/dev-sidecar.sh
      - name: cargo check
        run: cargo check --locked --all-targets
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # The same tests as `cargo test` (there are no doctests), built with coverage
      # instrumentation. No debug info: coverage doesn't need it and it keeps the build small.
      - name: cargo test (with coverage)
        id: tests
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          cargo llvm-cov --locked --json --summary-only --output-path "$RUNNER_TEMP/llvm-cov.json"
          echo "coverage=$(jq '.data[0].totals.lines.percent * 10 | round / 10' "$RUNNER_TEMP/llvm-cov.json")" >> "$GITHUB_OUTPUT"

  release-build:
    name: Community release build (scripts/build-release.sh, Linux, no bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: WebKit and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      # The same script the release uses, as Community and in its two phases: the sidecar must
      # say "community" and app/dist must hold no Team code, or the script fails.
      - name: Install dependencies
        env:
          PYTHON: python
        run: bash scripts/build-release.sh --edition community --deps-only
      - name: Build
        run: bash scripts/build-release.sh --edition community --no-bundle --no-deps

  install-script:
    name: Install commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # breakpatch-ci's install command needs Python 3.11 (ubuntu-latest's own is newer).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Test the install command against fake releases
        run: bash scripts/test-install.sh
      - name: Test breakpatch-ci's install command against fake releases
        run: bash scripts/test-install-ci.sh

  # breakpatch-ci as a release builds it, Linux only (the macOS wheel is built by release.yml on
  # a tag, never here). Both wheels are built with a throwaway licence key made in this job
  # (its private half only in RUNNER_TEMP, never uploaded), installed into a clean Python 3.11
  # environment from the requirements file the build wrote, exactly as
  # https://breakpatch.dev/install-ci installs them, and then run for real against the open
  # engine's test pages and a fake licence service: a passing test, a failing one, a test from
  # another system and no licence. The Team wheel must hold the compiled module only.
  ci-command:
    name: breakpatch-ci wheels (Linux, throwaway key)
    runs-on: ubuntu-latest
    env:
      HAS_TEAM: ${{ secrets.TEAM_CI_TOKEN != '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - name: Skipped without the Team repo
        if: env.HAS_TEAM != 'true'
        run: echo "::notice::TEAM_CI_TOKEN isn't available here (a fork, or not set up yet), so breakpatch-ci's wheels weren't built."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HAS_TEAM == 'true'
        with:
          path: breakpatch
          persist-credentials: false
      - name: Check out the Team module
        if: env.HAS_TEAM == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.TEAM_REPO || 'BreakPatch/breakpatch-team' }}
          ref: ${{ vars.TEAM_REF || 'main' }}
          token: ${{ secrets.TEAM_CI_TOKEN }}
          path: breakpatch-team
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.HAS_TEAM == 'true'
        with:
          python-version: "3.11"
      - name: Install the build dependencies (hashed locks)
        if: env.HAS_TEAM == 'true'
        env:
          TEAM_DIR: breakpatch-team
        run: bash breakpatch/scripts/build-ci.sh --deps-only
      - name: Build both wheels with a throwaway key
        if: env.HAS_TEAM == 'true'
        env:
          TEAM_DIR: breakpatch-team
        run: |
          python breakpatch-team/engine/scripts/smoke_ci_wheel.py keys --seed-file "$RUNNER_TEMP/ci-smoke.seed" > "$RUNNER_TEMP/ci-smoke-keys.json"
          bash breakpatch/scripts/build-ci.sh --no-deps --keys-file "$RUNNER_TEMP/ci-smoke-keys.json" --out "$RUNNER_TEMP/dist"
      - name: No Team source in the wheel
        if: env.HAS_TEAM == 'true'
        run: |
          python breakpatch-team/engine/scripts/make_wheel.py check "$RUNNER_TEMP"/dist/breakpatch_team_engine-*.whl
          if python -m zipfile -l "$RUNNER_TEMP"/dist/breakpatch_team_engine-*.whl | grep -E '\.py[co]?( |$)'; then
            echo "::error::the Team wheel holds Python source"; exit 1
          fi
      - name: Install into a clean environment, as the install command does
        if: env.HAS_TEAM == 'true'
        working-directory: ${{ runner.temp }}/dist
        run: |
          python -m venv "$RUNNER_TEMP/breakpatch-ci"
          "$RUNNER_TEMP/breakpatch-ci/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r breakpatch-ci-requirements-linux-x86_64.txt
          "$RUNNER_TEMP/breakpatch-ci/bin/python" -m playwright install --with-deps chromium --no-shell
      - name: Run it for real
        if: env.HAS_TEAM == 'true'
        run: |
          python breakpatch-team/engine/scripts/smoke_ci_wheel.py run --ci "$RUNNER_TEMP/breakpatch-ci/bin/breakpatch-ci" \
            --seed-file "$RUNNER_TEMP/ci-smoke.seed" --site breakpatch/engine/tests/site \
            --version "$(node -p "require('./breakpatch/app/package.json').version")"

  badges:
    name: Coverage badges (main only)
    needs: [ui, engine, shell]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the badges branch; nothing else in this workflow can write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false   # publish-badges.sh passes the token for its one push
      - name: Publish to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP: ${{ needs.ui.outputs.coverage }}
          ENGINE: ${{ needs.engine.outputs.coverage }}
          SHELL_COV: ${{ needs.shell.outputs.coverage }}
        run: |
          bash .github/scripts/publish-badges.sh \
            coverage-app "coverage app" "$APP" \
            coverage-engine "coverage engine" "$ENGINE" \
            coverage-shell "coverage shell" "$SHELL_COV"
