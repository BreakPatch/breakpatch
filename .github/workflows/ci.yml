name: CI

# A change to documentation only (docs/manual.md, READMEs, notes) runs nothing here: the site workflow
# builds the Documentation page. The same skip as the Team repo's CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Community edition only: the private Team module (Breakpatch/breakpatch-team) is not checked
# out here, so the app builds without app/src/edition/team and the engine without
# breakpatch_team_engine. The Team repo's own CI tests both together. One exception, the
# ci-command job: it builds breakpatch-ci's wheels as a release does (scripts/build-ci.sh in the
# manylinux_2_28 container, Linux, a throwaway licence key) and tries them in a clean Python
# environment and in clean Ubuntu and Debian containers. It needs the Team repo,
# so it only runs where the secret TEAM_CI_TOKEN is available (pushes and pull requests from this
# repository, not from forks) and otherwise says why it skipped. It uses the Team branch named as
# this one when there is one (a change made in both repositories), else TEAM_REF or main.
#
# Coverage: the ui, engine and shell jobs each report a line coverage total. On pushes to main the
# badges job writes them as shields.io endpoint files to the orphan branch `badges`
# (.github/scripts/publish-badges.sh), which the README's coverage badges read. No third-party
# service or token; that job alone may write to the repo.

jobs:
  ui:
    name: UI (typecheck, build, tests)
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # No install scripts (security review S2); the build and tests don't need any.
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npx vite build
      - name: Tests (with coverage)
        id: tests
        run: |
          npx vitest run --coverage
          echo "coverage=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")" >> "$GITHUB_OUTPUT"

  engine:
    name: Engine (pytest)
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
    defaults:
      run:
        working-directory: engine
    env:
      # One place for Playwright's Chromium, used by both the install and the tests.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/locks/linux-x86_64.dev.txt
      # From the hashed lock (security review S3; scripts/lock-python.sh writes it), then the
      # engine itself without dependencies. pip check fails if the lock misses one.
      - name: Install the engine
        run: |
          python -m pip install --require-hashes -r locks/build.txt
          python -m pip install --require-hashes --no-build-isolation -r locks/linux-x86_64.dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Tests (with coverage)
        id: tests
        run: |
          python -m pytest -q --cov --cov-report=term
          echo "coverage=$(python -m coverage report --format=total --precision=1)" >> "$GITHUB_OUTPUT"

  # The engine's tests on Windows and Linux arm64. Manual runs only (Actions → CI →
  # Run workflow): they don't run on pushes or pull requests, so they cost no minutes until asked.
  engine-platforms:
    name: Engine (pytest) on ${{ matrix.platform }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: windows-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: engine
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the engine
        run: |
          python -m pip install --require-hashes -r locks/build.txt
          python -m pip install --require-hashes --no-build-isolation -r "locks/${{ matrix.platform }}.dev.txt"
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m pytest -q

  shell:
    name: Tauri shell (cargo check, clippy, test)
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WebKit and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential patchelf
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.98.1
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov
      # tauri-build requires every externalBin to exist; the placeholder is enough to compile.
      - name: Placeholder engine sidecar
        run: sh ../scripts/dev-sidecar.sh
      - name: cargo check
        run: cargo check --locked --all-targets
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # The same tests as `cargo test` (there are no doctests), built with coverage
      # instrumentation. No debug info: coverage doesn't need it and it keeps the build small.
      - name: cargo test (with coverage)
        id: tests
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          cargo llvm-cov --locked --json --summary-only --output-path "$RUNNER_TEMP/llvm-cov.json"
          echo "coverage=$(jq '.data[0].totals.lines.percent * 10 | round / 10' "$RUNNER_TEMP/llvm-cov.json")" >> "$GITHUB_OUTPUT"

  # The shell's Windows and Linux code, on Ubuntu only: clippy for the Windows
  # target through MinGW (a compile check, nothing runs), the saved-secrets store against a
  # real Secret Service (GNOME Keyring on a private session bus), then with none at all, and the
  # .bpworkspace file type through update-mime-database. No app is built or released for either
  # system here.
  shell-platforms:
    name: Tauri shell (Windows target clippy, Linux keyring)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/src-tauri
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WebKit, system libraries, MinGW, GNOME Keyring and shared-mime-info
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential patchelf gcc-mingw-w64-x86-64 gnome-keyring dbus-daemon shared-mime-info
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - name: Placeholder engine sidecars
        run: |
          sh ../scripts/dev-sidecar.sh
          cp binaries/breakpatch-engine-x86_64-unknown-linux-gnu binaries/breakpatch-engine-x86_64-pc-windows-gnu.exe
      - name: cargo clippy (Windows target)
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      # The runner has a user session bus at /run/user/<uid>/bus that starts GNOME Keyring when
      # asked, and zbus falls back to it (and to $XDG_RUNTIME_DIR/bus) when
      # DBUS_SESSION_BUS_ADDRESS is unset, so "no keyring" points the address at nothing. The real
      # keyring gets a private bus, runtime dir and data dir, so `--unlock` makes a new `login`
      # keyring, the default collection. A failing test's panic becomes an annotation.
      - name: Saved secrets in GNOME Keyring, and a plain error without a keyring
        run: |
          annotate=../../.github/scripts/cargo-test-annotate.sh
          kr="$RUNNER_TEMP/keyring"
          mkdir -p "$kr/run" "$kr/data" && chmod 700 "$kr/run"
          # shellcheck disable=SC2016   # $0 is for the inner sh: the annotate script
          XDG_RUNTIME_DIR="$kr/run" XDG_DATA_HOME="$kr/data" dbus-run-session -- sh -c \
            'echo ci | gnome-keyring-daemon --unlock --components=secrets --daemonize >/dev/null || { echo "::error::gnome-keyring-daemon --unlock failed"; exit 1; }
               exec sh "$0" cargo test --locked real_keyring -- --ignored' \
            "$annotate"
          DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNNER_TEMP/no-session-bus" XDG_RUNTIME_DIR="$RUNNER_TEMP/no-runtime-dir" \
            sh "$annotate" cargo test --locked no_keyring_message -- --ignored
      # The .bpworkspace type the .deb and the AppImage register (linux/breakpatch-mime.xml).
      - name: The workspace file type passes update-mime-database
        run: sh ../../.github/scripts/cargo-test-annotate.sh cargo test --locked update_mime_database -- --ignored

  release-build:
    name: Community release build (scripts/build-release.sh, Linux, no bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WebKit and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      # The same script the release uses, as Community and in its two phases: the sidecar must
      # say "community" and app/dist must hold no Team code, or the script fails.
      - name: Install dependencies
        env:
          PYTHON: python
        run: bash scripts/build-release.sh --edition community --deps-only
      - name: Build
        run: bash scripts/build-release.sh --edition community --no-bundle --no-deps

  install-script:
    name: Install commands
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # breakpatch-ci's install command needs Python 3.11 (ubuntu-24.04's own is newer).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Test the install command against fake releases
        run: bash scripts/test-install.sh
      - name: Test breakpatch-ci's install command against fake releases
        run: bash scripts/test-install-ci.sh

  # The app's install command on a Mac, where `curl … | sh` runs it with the Mac's own /bin/sh:
  # bash 3.2, in a UTF-8 locale as Terminal has it. There "$version…" was read as one name and
  # stopped the script, which the Linux job's dash and bash 5 never showed. On a Mac
  # test-install.sh runs the installer with /bin/sh and /bin/bash --posix; its stand-ins (uname,
  # sw_vers, codesign, osascript, open, xattr, id) come first on PATH there too, so nothing is
  # installed or opened for real. Only its root-only case (setpriv, Linux) is skipped.
  install-script-macos:
    name: Install command (macOS's own sh, bash 3.2)
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # The test's certificate needs openssl req -addext: Homebrew's OpenSSL 3 rather than the
      # system's LibreSSL. shellcheck and gpg, if the runner image doesn't have them.
      - name: Tools
        run: |
          brew list --versions openssl@3 >/dev/null || brew install -q openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          command -v shellcheck >/dev/null || brew install -q shellcheck
          # The Linux desktop app's cases sign their fake releases' SHA256SUMS with gpg.
          command -v gpg >/dev/null || brew install -q gnupg
          # The test harness itself needs a newer bash than macOS's 3.2; the install command it
          # tests still runs under /bin/sh and /bin/bash --posix, macOS's own 3.2.
          brew list --versions bash >/dev/null || brew install -q bash
          echo "BP_TEST_BASH=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
          /bin/sh -c 'echo "/bin/sh is bash $BASH_VERSION"'
      - name: Test the install command against fake releases
        env:
          TMPDIR: ${{ runner.temp }}   # rather than /var/folders/…, a path through the /var link
        run: '"$BP_TEST_BASH" scripts/test-install.sh'

  # The GitHub Action (action/, issue #6) and the workflows: actionlint on every workflow,
  # shellcheck on the action's scripts and the release scripts, and the action's own test (its
  # scripts against a fake release and a stand-in breakpatch-ci). actionlint is built from its
  # tagged source with the runner's Go; shellcheck is on the runner image.
  lint-actions:
    name: GitHub Action and workflows (actionlint, shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: actionlint
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$RUNNER_TEMP/bin/actionlint" -color
      - name: shellcheck
        run: shellcheck action/scripts/*.sh action/test.sh scripts/test-ci-containers.sh site/install-ci scripts/linux-release-files.sh scripts/linux-release-merge.sh scripts/release-add-files.sh scripts/release-put-sums.sh scripts/test-release-merge.sh
      - name: The action's scripts
        run: bash action/test.sh
      - name: The release scripts (publish-linux, publish-ci) and release.yml's needs
        run: bash scripts/test-release-merge.sh

  # breakpatch-ci as a release builds it, Linux only (the macOS wheel is built by release.yml on
  # a tag, never here). Both wheels are built with a throwaway licence key made in this job
  # (its private half only in RUNNER_TEMP, never uploaded), installed into a clean Python 3.11
  # environment from the requirements file the build wrote, exactly as
  # https://breakpatch.dev/install-ci installs them, and then run for real against the open
  # engine's test pages and a fake licence service: a passing test, a failing one, a test from
  # another system and no licence. The Team wheel must hold the compiled module only.
  ci-command:
    name: breakpatch-ci wheels (Linux, throwaway key)
    runs-on: ubuntu-24.04
    env:
      HAS_TEAM: ${{ secrets.TEAM_CI_TOKEN != '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - name: Skipped without the Team repo
        if: env.HAS_TEAM != 'true'
        run: echo "::notice::TEAM_CI_TOKEN isn't available here (a fork, or not set up yet), so breakpatch-ci's wheels weren't built."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TEAM == 'true'
        with:
          path: breakpatch
          persist-credentials: false
      # The Team branch of the same name as this one when there is one (a change made in both
      # repositories, like linux), else TEAM_REF or main. The token goes to curl on stdin only.
      - name: Which Team branch
        id: team
        if: env.HAS_TEAM == 'true'
        env:
          TOKEN: ${{ secrets.TEAM_CI_TOKEN }}
          TEAM_REPO: ${{ vars.TEAM_REPO || 'BreakPatch/breakpatch-team' }}
          FALLBACK: ${{ vars.TEAM_REF || 'main' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=$FALLBACK
          case "$BRANCH" in
            '' | main | *[!A-Za-z0-9._/-]*) ;;
            *)
              if printf 'Authorization: Bearer %s\n' "$TOKEN" | curl -fsS -o /dev/null -H @- \
                   -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$TEAM_REPO/branches/$BRANCH" 2>/dev/null; then
                ref=$BRANCH
              fi ;;
          esac
          echo "Team module: $TEAM_REPO at $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out the Team module
        if: env.HAS_TEAM == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.TEAM_REPO || 'BreakPatch/breakpatch-team' }}
          ref: ${{ steps.team.outputs.ref }}
          token: ${{ secrets.TEAM_CI_TOKEN }}
          path: breakpatch-team
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.HAS_TEAM == 'true'
        with:
          python-version: "3.11"
      # As the release builds them: in the manylinux_2_28 container (scripts/build-manylinux.sh runs
      # both phases of build-ci.sh there), so the Team module needs glibc 2.28 at most. Built
      # straight on the runner (glibc 2.39) it can't load on Ubuntu 22.04 or Debian 12, which the
      # clean containers below check.
      - name: Build both wheels with a throwaway key (manylinux_2_28 container)
        if: env.HAS_TEAM == 'true'
        env:
          TEAM_DIR: breakpatch-team
          MANYLINUX_IMAGE: ${{ vars.MANYLINUX_X64_IMAGE || 'quay.io/pypa/manylinux_2_28_x86_64' }}
        run: |
          python breakpatch-team/engine/scripts/smoke_ci_wheel.py keys --seed-file "$RUNNER_TEMP/ci-smoke.seed" > "$RUNNER_TEMP/ci-smoke-keys.json"
          bash breakpatch/scripts/build-manylinux.sh ci --keys-file "$RUNNER_TEMP/ci-smoke-keys.json" --out "$RUNNER_TEMP/dist"
      - name: The release's check of the requirements file
        if: env.HAS_TEAM == 'true'
        run: bash breakpatch/scripts/check-ci-requirements.sh "$RUNNER_TEMP/dist"
      - name: No Team source in the wheel
        if: env.HAS_TEAM == 'true'
        run: |
          python breakpatch-team/engine/scripts/make_wheel.py check "$RUNNER_TEMP"/dist/breakpatch_team_engine-*.whl
          if python -m zipfile -l "$RUNNER_TEMP"/dist/breakpatch_team_engine-*.whl | grep -E '\.py[co]?( |$)'; then
            echo "::error::the Team wheel holds Python source"; exit 1
          fi
      - name: Install into a clean environment, as the install command does
        if: env.HAS_TEAM == 'true'
        working-directory: ${{ runner.temp }}/dist
        run: |
          python -m venv "$RUNNER_TEMP/breakpatch-ci"
          "$RUNNER_TEMP/breakpatch-ci/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r breakpatch-ci-requirements-linux-x86_64.txt
          "$RUNNER_TEMP/breakpatch-ci/bin/python" -m playwright install --with-deps chromium --no-shell
      - name: Run it for real
        if: env.HAS_TEAM == 'true'
        run: |
          python breakpatch-team/engine/scripts/smoke_ci_wheel.py run --ci "$RUNNER_TEMP/breakpatch-ci/bin/breakpatch-ci" \
            --seed-file "$RUNNER_TEMP/ci-smoke.seed" --site breakpatch/engine/tests/site \
            --version "$(node -p "require('./breakpatch/app/package.json').version")"
      # The same wheels through site/install-ci in clean ubuntu:22.04, ubuntu:24.04 and debian:12
      # containers: no Python, no curl, none of Chromium's libraries to start with.
      - name: Install it in clean containers, as a customer does
        if: env.HAS_TEAM == 'true'
        env:
          TEAM_DIR: breakpatch-team
        run: bash breakpatch/scripts/test-ci-containers.sh --dist "$RUNNER_TEMP/dist" --seed "$RUNNER_TEMP/ci-smoke.seed"

  badges:
    name: Coverage badges (main only)
    needs: [ui, engine, shell]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # pushes the badges branch; nothing else in this workflow can write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false   # publish-badges.sh passes the token for its one push
      - name: Publish to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP: ${{ needs.ui.outputs.coverage }}
          ENGINE: ${{ needs.engine.outputs.coverage }}
          SHELL_COV: ${{ needs.shell.outputs.coverage }}
        run: |
          bash .github/scripts/publish-badges.sh \
            coverage-app "coverage app" "$APP" \
            coverage-engine "coverage engine" "$ENGINE" \
            coverage-shell "coverage shell" "$SHELL_COV"
