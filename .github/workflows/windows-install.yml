name: Windows install

# site/install-ci.ps1, breakpatch-ci's install command for Windows, on a real Windows machine and
# against a real release: scripts/test-install-ci.ps1, in Windows PowerShell 5.1 and in
# PowerShell 7. By hand only (Actions → Windows install → Run workflow), with a version to
# install or, left empty, GitHub's Latest release. It isn't in ci.yml: it downloads the release,
# its Python packages, Chromium and Python 3.11, and takes a while. On every pull request
# scripts/test-install-ci.sh runs the same script with pwsh on Linux, against fake releases.
#
# Each failure is also a check-run annotation saying which step failed and what it printed: the
# job's log can't be downloaded where the maintainers work.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to install, such as 0.1.0-beta.2 (empty: GitHub's Latest release)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  install-ci-ps1:
    name: install-ci.ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]   # Windows PowerShell 5.1, PowerShell 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Case 1 installs with a Python 3.11 the machine has already: this step puts one on PATH.
      # Case 7 takes it off PATH, and the installer downloads its own.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Test install-ci.ps1 in ${{ matrix.shell }}
        shell: pwsh
        env:
          BP_TEST_SHELL: ${{ matrix.shell }}
          BP_TEST_VERSION: ${{ inputs.version }}
          # One case installs with it as BREAKPATCH_GITHUB_TOKEN (read-only, this repository).
          BP_TEST_GITHUB_TOKEN: ${{ github.token }}
        run: |
          & $env:BP_TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-install-ci.ps1
          $code = $LASTEXITCODE
          # 1 is failed checks, each with its annotation already; anything else stopped it first.
          if ($code -ne 0 -and $code -ne 1) {
            Write-Output "::error title=test-install-ci.ps1::[$env:BP_TEST_SHELL] the test stopped with exit code $code before it could report"
          }
          exit $code
