name: Release

# Push a tag like v0.2.0 (matching app/package.json "version") to build, sign and publish
# Breakpatch for Apple Silicon. A tag with a "-" (v0.1.0-beta.1) is a beta. While there's no
# stable release yet, a beta is published as the "Latest" release, so the default install command
# and the in-app updater get it; once there is one, betas are GitHub prereleases, never "Latest"
# (see the publish job). The release carries the .app.tar.gz + .sig (updates,
# and what the install command https://breakpatch.dev/install downloads), latest.json, which
# the in-app updater reads from the URL in app/src-tauri/tauri.conf.json
# (plugins.updater.endpoints), and SHA256SUMS, which the install command checks against.
#
# Releases are the Team edition (docs/editions.md), built by scripts/build-release.sh, the same
# script people use: it links the private module, installs the Team engine, builds the sidecar,
# the frontend and the app, and puts the checkout back to Community at the end. This workflow
# only checks the two repos out side by side and publishes what the script built.
# Licence checks decide at run time what a copy may use.
#
# Jobs (security review S1, S2, S5, R3):
#   build       tag runs only, in the `release` environment (the owner approves each run; tags
#               v* only), which holds the signing secrets. Dependencies are installed first,
#               with no secret in the environment (build-release.sh --deps-only: hashed pip
#               lock, npm ci --ignore-scripts, cargo fetch --locked); only the build-and-sign
#               step gets the secrets (--no-deps --release: nothing is downloaded there). No
#               caches are restored, so no other run can poison a release. Always --release:
#               the real licence keys only, never the public test key.
#   publish     needs build; the only job that can write (contents: write). It downloads the
#               build's files, checks SHA256SUMS and creates the GitHub release. No checkout.
#   linux-release-key, app-linux-x64, publish-linux
#               Only while the repository variable LINUX_DESKTOP is `on`: until the llama.cpp
#               runtime and the GGUF model are pinned (build-release.sh --release refuses them
#               off macOS), a tag would only fail there and wait for an approval it can't use.
#               Without it all three are skipped, and publish-ci and sign-sums go on as before.
#               linux-release-key goes first: with LINUX_DESKTOP on, it fails while the tagged
#               site/install's GPG_FINGERPRINT is TODO-owner (Linux installs check SHA256SUMS.asc
#               with that key), so the Linux app is never published without it; the Mac app and
#               breakpatch-ci are published as usual.
#               The Linux x64 desktop app (a preview): the Team edition as an AppImage and a .deb,
#               built by the same script in an Ubuntu 22.04 container (glibc 2.35, so it runs on
#               22.04 and later and on Debian 12), tag runs only, in the `release` environment.
#               It needs only the updater key: nothing is code signed on Linux.
#               scripts/linux-release-files.sh checks the bundles and names the files.
#               publish-linux runs after publish, so macOS never waits for Linux and a Linux
#               failure leaves the release as it is (with a warning). It adds the files, merges the
#               Linux platforms into latest.json and adds their lines to SHA256SUMS. Safe to re-run:
#               a file the release already has must have the same SHA-256 (it's uploaded again
#               with --clobber), and a Linux platform already in latest.json the same entry.
#               SHA256SUMS is uploaded only when its lines change, and then the release's
#               SHA256SUMS.asc goes first (scripts/release-put-sums.sh): never a stale signature.
#   sign-sums   last: downloads every file of the release, checks it against SHA256SUMS and signs
#               SHA256SUMS with GPG (SHA256SUMS.asc). The tagged site/install's GPG_FINGERPRINT
#               decides: while it's TODO-owner, without the GPG_SIGNING_KEY secret it says so and
#               signs nothing, as before. Once it's pinned, a missing key or another key fails
#               the job, and the release becomes Latest only here, once SHA256SUMS.asc is up
#               (publish makes it Latest straight away only while the fingerprint is TODO-owner):
#               Linux installs with gpg never meet a Latest release without its signature.
#   ci-linux, ci-macos, ci-linux-arm64, ci-windows-x64, publish-ci
#               breakpatch-ci (Team, for CI machines), built and published after the app: they
#               need publish, so the app and Community never wait for them, and a failure here
#               leaves the app's release as it is. Tag runs only, like every job but test-build:
#               nothing here runs on a push to a branch. scripts/build-ci.sh builds the open engine
#               wheel (once, on Linux; the macOS job reuses it), the Team engine compiled with
#               Nuitka --module into a wheel (the Team repo's engine/scripts/build_ci_wheel.sh,
#               the real licence keys only) and breakpatch-ci-requirements-<platform>.txt, which
#               https://breakpatch.dev/install-ci installs with pip --require-hashes. ci-linux
#               (Linux x86_64) runs on ubuntu, ci-macos on
#               macos-15; both in the `release` environment for TEAM_REPO_TOKEN, installing their
#               dependencies from the hashed locks first, with no secret in the environment.
#               publish-ci adds the files to the release and their lines to SHA256SUMS; the
#               macOS, arm64 and Windows files only when their job worked. Safe to re-run (a
#               re-run of the Linux desktop build re-runs it too): a file the release already
#               lists must have the same SHA-256, and is uploaded again with --clobber
#               (scripts/release-add-files.sh, scripts/release-put-sums.sh).
#               The Linux jobs build inside a manylinux_2_28 container
#               (scripts/build-manylinux.sh), so the Team wheel is tagged manylinux_2_28_<arch>
#               and loads on glibc 2.28 and later (Debian 12, Raspberry Pi OS, Ubuntu 22.04):
#               ci-linux on ubuntu-24.04, ci-linux-arm64 on ubuntu-24.04-arm.
#               The repository variable CI_MANYLINUX=off builds ci-linux on the runner as before
#               (tagged linux_x86_64: only for glibc 2.39 and later). ci-windows-x64 (a preview)
#               builds under Git Bash on windows-latest (MSVC for Nuitka). The arm64 and Windows
#               jobs reuse ci-linux's engine wheel, like ci-macos.
#   test-build-linux  manual runs: the same, unsigned Community, AppImage and .deb in the
#               Ubuntu 22.04 container, kept 3 days.
#   smoke-ci-linux  after publish-ci: the published breakpatch-ci installed with this tag's
#               site/install-ci in clean ubuntu:22.04, ubuntu:24.04 and debian:12 containers, on
#               x86_64 and arm64; then install-deps, setup, and a run without a licence (exit 3).
#   ci-image-build, ci-image
#               ghcr.io/breakpatch/ci:<version> (docker/ci/Dockerfile), amd64 and arm64, each on its
#               own runner, joined into one tag; `latest` only when this release is GitHub's
#               Latest release (never a prerelease, nor an older version's fix). The only jobs
#               with packages: write, which only docker login and the push use (no token goes
#               into the build). Repository variable CI_IMAGE_BASE: the base image, pinned by
#               digest; unset, it's the ubuntu:24.04 digest written below (checked 2026-10-14).
#               One that isn't pinned fails ci-image-build only (the app and breakpatch-ci are
#               published before it, and nothing waits on it).
#   test-build  manual runs (workflow_dispatch): an unsigned Community build on macOS, with no
#               secrets at all (not even the Team repo token), kept as a workflow artifact for
#               3 days. It tries the macOS build, the AI assistant bundle and the hardened
#               runtime (ad-hoc signed) before a tag. A signed Team build only ever comes from
#               a tag; to try one first, run scripts/build-release.sh --edition team on a Mac.
#
# Code signing (scripts/build-release.sh picks the first that's set):
#   1. APPLE_* secrets: Apple Developer ID, notarised, hardened runtime.
#   2. BP_CODESIGN_P12 + BP_CODESIGN_P12_PASSWORD: Breakpatch's own certificate
#      (scripts/make-signing-cert.sh), hardened runtime. It must match
#      app/src-tauri/signing/fingerprint.txt, so every release keeps the same signing identity
#      and the Keychain doesn't ask after updates.
#   A tag build fails without the updater key and one of those.
#
# Settings (Settings → Environments → release; SECURITY-REPORT section 7):
#   environment `release`  required reviewer: the owner; deployment refs: tags v* only
#     secrets  TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
#              BP_CODESIGN_P12, BP_CODESIGN_P12_PASSWORD (or the APPLE_* ones),
#              TEAM_REPO_TOKEN (fine-grained, breakpatch-team only, Contents read-only)
#              GPG_SIGNING_KEY (ASCII-armoured secret key that signs SHA256SUMS; optional) and
#              GPG_SIGNING_KEY_PASSPHRASE (if it has one)
#   vars (repository)  TEAM_REPO  the Team repo. Default BreakPatch/breakpatch-team
#                      TEAM_REF   its branch or tag to build (default main)
#                      MANYLINUX_X64_IMAGE, MANYLINUX_ARM64_IMAGE  the manylinux_2_28 images,
#                                 pinned by digest (quay.io/pypa/manylinux_2_28_x86_64@sha256:…);
#                                 without them the jobs use the moving tag and warn
#                      CI_MANYLINUX  off: ci-linux builds on the runner, not in the container
#                      UBUNTU_2204_IMAGE  the Linux desktop build's container, pinned by digest
#                                 (ubuntu:22.04@sha256:…). Required by app-linux-x64 (a tag build with
#                                 LINUX_DESKTOP on); test-build-linux defaults to ubuntu:22.04
#                      CI_IMAGE_BASE  the container image's base, pinned by digest
#                                 (ubuntu:24.04@sha256:…). Optional: ci-image-build's default is pinned
#                      LINUX_DESKTOP  on: build and publish the Linux desktop app (app-linux-x64,
#                                 publish-linux). TODO(owner): turn on once runtimes.py and the
#                                 GGUF model in models.py are pinned, and site/install pins the
#                                 release key (linux-release-key refuses it before then).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A newer manual run replaces a test build; a tag build always finishes.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: macOS arm64 (signed release)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15 # Apple Silicon
    environment: release
    env:
      TARGET: aarch64-apple-darwin
    defaults:
      run:
        working-directory: breakpatch
    steps:
      # Side by side, as scripts/link-team.sh and build-release.sh expect:
      # $GITHUB_WORKSPACE/breakpatch and $GITHUB_WORKSPACE/breakpatch-team.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: breakpatch
          persist-credentials: false
      - name: Check out the Team module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.TEAM_REPO || 'BreakPatch/breakpatch-team' }}
          ref: ${{ vars.TEAM_REF || 'main' }}
          token: ${{ secrets.TEAM_REPO_TOKEN }}
          path: breakpatch-team
          persist-credentials: false

      # The app's version is app/package.json's (tauri.conf.json points there). The crate and the
      # engine carry the same one: the engine's names the Nuitka sidecar's unpack folder
      # ({CACHE_DIR}/breakpatch-engine/<version>), so a release with an unchanged engine version
      # would start the files an earlier one unpacked.
      - name: Tag matches the app version
        run: |
          app_version=$(node -p "require('./app/package.json').version")
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app/package.json version $app_version"
            exit 1
          fi
          crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' app/src-tauri/Cargo.toml | head -n 1)
          engine_version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' engine/src/breakpatch_engine/__init__.py)
          for v in "app/src-tauri/Cargo.toml:$crate_version" "engine/src/breakpatch_engine/__init__.py:$engine_version"; do
            if [ "${v#*:}" != "$app_version" ]; then
              echo "::error::${v%%:*} has version ${v#*:}, app/package.json $app_version"
              exit 1
            fi
          done

      # No caches on a tag build (security review S5): setup-node without `cache`, no
      # rust-cache, no ccache or Nuitka cache.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin

      # Everything third-party is installed here, with no secret in the environment: the build
      # venv from engine/locks/macos-arm64.dev-hardening-mlx.txt (--require-hashes), Nuitka's
      # downloads, npm ci --ignore-scripts, cargo fetch --locked.
      - name: Install dependencies (no secrets)
        env:
          PYTHON: python                     # setup-python's 3.11, for the build venv
          ENGINE_EXTRAS: dev,mlx,hardening   # mlx-vlm (AI assistant) + Nuitka (Team hardening)
        run: bash scripts/build-release.sh --edition team --target "$TARGET" --deps-only

      # With the APPLE_* secrets the Tauri CLI imports APPLE_CERTIFICATE, signs the app and the
      # sidecar with APPLE_SIGNING_IDENTITY (hardened runtime, Entitlements.plist) and notarises
      # with APPLE_ID / APPLE_PASSWORD (app-specific password) / APPLE_TEAM_ID. Without them,
      # the script imports BP_CODESIGN_P12 into a temporary keychain (only once the sidecar and
      # the frontend are built), checks it against the committed fingerprint and has Tauri sign
      # with it. Either way the script verifies the signed app, the update archive and the .dmg,
      # and the Tauri key signs the update archive. The script keeps these variables out of the
      # environment of everything but the signing commands.
      - name: Build and sign the Team edition
        env:
          TEAM_DIR: breakpatch-team      # relative to the folder that holds this checkout
          ENGINE_EXTRAS: dev,mlx,hardening
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BP_CODESIGN_P12: ${{ secrets.BP_CODESIGN_P12 }}
          BP_CODESIGN_P12_PASSWORD: ${{ secrets.BP_CODESIGN_P12_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-release.sh --edition team --target "$TARGET" --bundles app,dmg --no-deps --release

      - name: Collect the release files
        id: files
        run: |
          version=$(node -p "require('./app/package.json').version")
          bundle="app/src-tauri/target/$TARGET/release/bundle"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          # The .dmg is built (build-release.sh checks it holds the signed app) but not published:
          # Breakpatch is installed with the install command only, so macOS never quarantines it.
          cp "$bundle/macos/Breakpatch.app.tar.gz" "$out/Breakpatch_aarch64.app.tar.gz"
          cp "$bundle/macos/Breakpatch.app.tar.gz.sig" "$out/Breakpatch_aarch64.app.tar.gz.sig"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/Breakpatch_aarch64.app.tar.gz"
          # shellcheck disable=SC2016  # the single-quoted text is JavaScript, not shell
          SIG="$(cat "$out/Breakpatch_aarch64.app.tar.gz.sig")" URL="$url" VERSION="$version" node -e '
            const p = { signature: process.env.SIG, url: process.env.URL };
            const doc = { version: process.env.VERSION, notes: `Breakpatch ${process.env.VERSION}`,
              pub_date: new Date().toISOString(), platforms: { "darwin-aarch64": p, "darwin-aarch64-app": p } };
            require("fs").writeFileSync(process.argv[1], JSON.stringify(doc, null, 2) + "\n");
          ' "$out/latest.json"
          # Checksums of everything in the release; the install command checks the archive.
          (cd "$out" && shasum -a 256 -- * > SHA256SUMS)
          cat "$out/SHA256SUMS"
          ls -l "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakpatch-release
          path: ${{ steps.files.outputs.dir }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      latest-at-end: ${{ steps.publish.outputs.latest-at-end }}
    permissions:
      contents: write   # creates the release; the only job in this workflow that can write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: breakpatch-release
          path: release
      # Published straight away. The updater feed is releases/latest/download/latest.json
      # (app/src-tauri/tauri.conf.json), and releases/latest is the release marked "Latest",
      # which GitHub never makes a draft or a prerelease. The install command's default is the
      # same releases/latest. So each release carries its own latest.json, and:
      #   - a stable tag (no "-", v0.1.0) is published as before: GitHub makes the newest Latest;
      #   - a beta tag (with "-", v0.1.0-beta.2) while no stable release exists yet is published
      #     as Latest too, not as a prerelease: the plain install command installs it and beta
      #     copies update to it (0.1.0-beta.2 > 0.1.0-beta.1, and later 0.1.0 > 0.1.0-beta.2);
      #   - a beta tag once a stable release exists is a prerelease, never Latest: stable copies
      #     never see it. It installs with BREAKPATCH_CHANNEL=beta or BREAKPATCH_VERSION.
      # The notes are docs/releases/<tag>.md at the tagged commit when it exists (read through the
      # API: this job has no checkout), else a line on how to install.
      # Once the tagged site/install pins the release key (GPG_FINGERPRINT isn't TODO-owner), a
      # release that would be Latest is published as not Latest, and sign-sums makes it Latest
      # once SHA256SUMS.asc is up (latest-at-end=1): Linux installs check that signature, so the
      # Latest release must never be without it. While it's TODO-owner, nothing changes.
      - name: Check and publish
        id: publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check --strict SHA256SUMS
          # Read through the API at the tagged commit; when it can't be read, Latest waits too.
          pin=$(gh api "repos/$GITHUB_REPOSITORY/contents/site/install?ref=$GITHUB_SHA" \
                  -H 'Accept: application/vnd.github.raw' 2>/dev/null | sed -n 's/^GPG_FINGERPRINT=//p' | head -n 1 || true)
          at_end=0
          if [ "$pin" != TODO-owner ]; then at_end=1; fi
          version=${GITHUB_REF_NAME#v}
          install="Install or update from Terminal: \`curl -fsSL https://breakpatch.dev/install | sh\` (Apple Silicon, macOS 14 or later). Installed copies update themselves."
          case "$GITHUB_REF_NAME" in
            *-*)
              # Published stable releases (drafts and beta tags don't count). A failed request
              # fails the job, so a beta is never made Latest by mistake.
              tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name')
              stable=$(printf '%s\n' "$tags" | grep -v -e - | grep . | head -n 1 || true)
              if [ -z "$stable" ]; then
                kind=beta-latest
                flags=(--latest)
              else
                kind=prerelease
                flags=(--prerelease --latest=false)
                install="Beta. Install or update from Terminal: \`curl -fsSL https://breakpatch.dev/install | BREAKPATCH_VERSION=$version sh\`, or the newest beta with \`BREAKPATCH_CHANNEL=beta\` (Apple Silicon, macOS 14 or later). Betas aren't offered to stable copies."
              fi ;;
            *)
              kind=stable
              flags=() ;;   # GitHub makes the newest version Latest, as before
          esac
          notes="$RUNNER_TEMP/notes.md"
          if gh api "repos/$GITHUB_REPOSITORY/contents/docs/releases/$GITHUB_REF_NAME.md?ref=$GITHUB_SHA" \
               -H 'Accept: application/vnd.github.raw' > "$notes" 2>/dev/null && [ -s "$notes" ]; then
            echo "Notes: docs/releases/$GITHUB_REF_NAME.md"
          else
            printf '%s\n' "$install" > "$notes"
          fi
          if [ "$at_end" -eq 1 ] && [ "$kind" != prerelease ]; then
            flags=(--latest=false)
            echo "latest-at-end=1" >> "$GITHUB_OUTPUT"
          else
            at_end=0
          fi
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Breakpatch $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            "${flags[@]}"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ "$at_end" -eq 1 ]; then
            echo "Published $GITHUB_REF_NAME; it becomes the Latest release once sign-sums has signed SHA256SUMS (Latest is ${latest:-none} until then)."
          elif [ "$kind" = stable ]; then
            echo "Published $GITHUB_REF_NAME; Latest is ${latest:-none}."
          elif [ "$kind" = prerelease ]; then
            # The stable feed must still be the stable release.
            if [ "$latest" = "$GITHUB_REF_NAME" ]; then
              echo "::error::$GITHUB_REF_NAME became the Latest release: mark it as a prerelease in the release's settings now"
              exit 1
            fi
            echo "Published $GITHUB_REF_NAME as a prerelease; Latest is ${latest:-none}."
          elif [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME isn't the Latest release (Latest is ${latest:-none}), so the install command and the updater don't see it: mark it as Latest in the release's settings"
            exit 1
          else
            echo "Published $GITHUB_REF_NAME as the Latest release (no stable release yet)."
          fi

  # ---------------------------------------------------------------- Linux x64 desktop (a preview)

  # Before the Linux desktop app is built: the tagged site/install must pin Breakpatch's release
  # key. Linux installs check SHA256SUMS's signature with it (sign-sums signs it), so with the
  # placeholder (GPG_FINGERPRINT=TODO-owner) a Linux release would install without anyone
  # checking who published it. Then this fails, app-linux-x64 is skipped (it needs this) and
  # publish-linux warns; the Mac app, breakpatch-ci and the rest are published as usual. Only with
  # LINUX_DESKTOP on, like the jobs it gates: a Mac-only tag never runs it. No environment, so it
  # fails before the owner is asked to approve anything.
  linux-release-key:
    name: Linux desktop (preview) needs the release key
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.LINUX_DESKTOP == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tagged
          sparse-checkout: site/install
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Release key pinned
        env:
          INSTALL: ${{ github.workspace }}/tagged/site/install
        run: |
          # The key this tag's installer trusts: a fingerprint (40 hex digits) and its public key.
          fpr=$(sed -n 's/^GPG_FINGERPRINT=//p' "$INSTALL" | head -n 1)
          if [ "$fpr" = TODO-owner ]; then
            echo "::error::LINUX_DESKTOP is on, but this tag's site/install has no release key yet (GPG_FINGERPRINT=TODO-owner), so Linux installs couldn't check who published the app. First do the owner step in site/install (the TODO(owner) above GPG_FINGERPRINT): add the release key as the release environment's GPG_SIGNING_KEY secret, put its fingerprint and public key in GPG_FINGERPRINT and GPG_PUBLIC_KEY, and tag again. Or turn LINUX_DESKTOP off. The Linux desktop app isn't built."
            exit 1
          fi
          if ! [[ "$fpr" =~ ^[0-9A-F]{40}$ ]] || ! grep -q "^GPG_PUBLIC_KEY='-----BEGIN PGP PUBLIC KEY BLOCK-----" "$INSTALL"; then
            echo "::error::GPG_FINGERPRINT in this tag's site/install isn't a fingerprint (40 hex digits, upper case) with its public key in GPG_PUBLIC_KEY ('${fpr:-unset}'): see the owner step (TODO(owner)) there. The Linux desktop app isn't built."
            exit 1
          fi
          echo "This tag's site/install pins the release key $fpr: the Linux desktop app is built."

  app-linux-x64:
    name: Linux x64 desktop (preview; AppImage and .deb)
    # Only with the repository variable LINUX_DESKTOP=on (see the top of this file), and once the
    # tagged site/install pins the release key (linux-release-key).
    needs: linux-release-key
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.LINUX_DESKTOP == 'on'
    runs-on: ubuntu-24.04
    environment: release
    # Ubuntu 22.04 (glibc 2.35, WebKitGTK 4.1), so the app runs on 22.04 and later and on Debian 12.
    # The repository variable UBUNTU_2204_IMAGE pins it by digest (ubuntu:22.04@sha256:…); the
    # first step fails without it.
    container:
      image: ${{ vars.UBUNTU_2204_IMAGE || 'ubuntu:22.04' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      # linuxdeploy (the AppImage tool) is an AppImage itself, and a container has no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
        working-directory: breakpatch
    steps:
      # First, before anything is installed or built: a tag build only from a container pinned by
      # digest (this job runs only with LINUX_DESKTOP on, so it never holds up a Mac-only release).
      - name: Container pinned
        working-directory: /
        env:
          IMAGE: ${{ vars.UBUNTU_2204_IMAGE }}
        run: |
          if [[ "$IMAGE" != *@sha256:* ]]; then
            echo "::error::The repository variable UBUNTU_2204_IMAGE must name the build's container by digest (ubuntu:22.04@sha256:…), not '${IMAGE:-unset}': the Linux desktop app isn't built."
            exit 1
          fi
      # Before the checkout: git (a real clone), lsb-release (setup-python reads it to pick its
      # Ubuntu 22.04 build), the WebKitGTK and GTK libraries, and the tools the bundles need.
      - name: System packages (Ubuntu 22.04)
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git lsb-release build-essential pkg-config file patchelf \
            xdg-utils desktop-file-utils shared-mime-info \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
          echo "glibc $(ldd --version | head -n 1 | awk '{ print $NF }')"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: breakpatch
          persist-credentials: false
      - name: Check out the Team module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.TEAM_REPO || 'BreakPatch/breakpatch-team' }}
          ref: ${{ vars.TEAM_REF || 'main' }}
          token: ${{ secrets.TEAM_REPO_TOKEN }}
          path: breakpatch-team
          persist-credentials: false
      # No caches on a tag build (security review S5).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tag matches the app version
        run: |
          app_version=$(node -p "require('./app/package.json').version")
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app/package.json version $app_version"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.98.1
      # As on macOS: everything third-party first, with no secret in the environment.
      - name: Install dependencies (no secrets)
        env:
          PYTHON: python
          ENGINE_EXTRAS: dev,hardening
        run: bash scripts/build-release.sh --edition team --deps-only
      # Only the updater key: nothing is code signed on Linux. It signs the AppImage and the .deb
      # (their .sig files, which the in-app updater checks).
      - name: Build the Team edition
        env:
          TEAM_DIR: breakpatch-team
          ENGINE_EXTRAS: dev,hardening
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-release.sh --edition team --bundles deb,appimage --no-deps --release
      # Checks the bundles (contents, desktop entry, glibc 2.35 at most, version) and names the
      # files for the release; latest-linux.json holds this platform's updater entries.
      - name: Collect the release files
        id: files
        run: |
          version=$(node -p "require('./app/package.json').version")
          out="$RUNNER_TEMP/release-linux"
          bash scripts/linux-release-files.sh --release --version "$version" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/" \
            app/src-tauri/target/release/bundle "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakpatch-release-linux-x64
          path: ${{ steps.files.outputs.dir }}
          if-no-files-found: error
          retention-days: 3

  # Adds the Linux files to the release publish made, after it: macOS never waits for Linux, and a
  # Linux failure leaves the macOS release as it is (a warning, no Linux files). latest.json gets
  # the Linux entries merged in, and SHA256SUMS a line per new file (and latest.json's new one).
  publish-linux:
    name: Publish the Linux desktop app
    needs: [publish, app-linux-x64]
    # Skipped with app-linux-x64 while LINUX_DESKTOP isn't on; publish-ci and sign-sums need it,
    # and run whatever its result (!cancelled()). With LINUX_DESKTOP on and no release key
    # (linux-release-key failed), app-linux-x64 is skipped and this only warns.
    if: ${{ !cancelled() && needs.publish.result == 'success' && vars.LINUX_DESKTOP == 'on' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # adds files to the release made by publish
    steps:
      - name: Built?
        id: built
        env:
          LINUX: ${{ needs.app-linux-x64.result }}
        run: |
          if [ "$LINUX" = success ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning::The Linux desktop app wasn't built ($LINUX); it isn't in this release."
          echo "ok=0" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.built.outputs.ok == '1'
        with:
          path: merge
          sparse-checkout: |
            scripts/linux-release-merge.sh
            scripts/release-put-sums.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.built.outputs.ok == '1'
        with:
          name: breakpatch-release-linux-x64
          path: linux
      - name: Check, merge and publish
        if: steps.built.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd linux && sha256sum --check --strict SHA256SUMS)
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --pattern latest.json --dir old
          # Safe to re-run: the release's own copy of a file must have the same SHA-256, and a Linux
          # platform already in latest.json the same entry (scripts/test-release-merge.sh).
          bash merge/scripts/linux-release-merge.sh old linux merged
          jq . merged/latest.json
          cat merged/SHA256SUMS
          mapfile -t files < merged/upload.txt
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          # Only when SHA256SUMS changes, and then without the old SHA256SUMS.asc.
          bash merge/scripts/release-put-sums.sh old/SHA256SUMS merged/SHA256SUMS merged/latest.json

  # SHA256SUMS signed with GPG (SHA256SUMS.asc), once every file is in the release: after the
  # macOS, Linux and breakpatch-ci files. Every file is downloaded and checked against it first.
  # The key is the `release` environment's secret GPG_SIGNING_KEY (an ASCII-armoured secret key;
  # GPG_SIGNING_KEY_PASSPHRASE if it has one). The tagged site/install says whether one is
  # required: while its GPG_FINGERPRINT is TODO-owner, without the key the job says so and signs
  # nothing; once it's pinned, the key must be there and be that key, and the signature must
  # check with site/install's GPG_PUBLIC_KEY, or the job fails (and the release isn't made Latest).
  # Re-run whenever a job that writes SHA256SUMS is (they're in its needs).
  sign-sums:
    name: Sign SHA256SUMS (GPG)
    needs: [publish, publish-linux, publish-ci]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # adds SHA256SUMS.asc to the release, and makes it Latest
    steps:
      # The tagged installer: its GPG_FINGERPRINT and GPG_PUBLIC_KEY.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tagged
          sparse-checkout: site/install
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download the release and check every file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release
          cd release
          rm -f SHA256SUMS.asc
          sha256sum --check --strict SHA256SUMS
          unlisted=$(comm -23 <(printf '%s\n' * | grep -vx SHA256SUMS | sort) <(awk '{ print $2 }' SHA256SUMS | sort))
          if [ -n "$unlisted" ]; then echo "::error::not in SHA256SUMS: $unlisted"; exit 1; fi
      - name: Sign SHA256SUMS
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}
          INSTALL: ${{ github.workspace }}/tagged/site/install
        run: |
          # The release key this tag's installer trusts: none yet (TODO-owner), or 40 hex digits.
          want=$(sed -n 's/^GPG_FINGERPRINT=//p' "$INSTALL" | head -n 1)
          if [ "$want" = TODO-owner ]; then
            want=""
          elif ! [[ "$want" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::GPG_FINGERPRINT in this tag's site/install is neither TODO-owner nor a fingerprint (40 hex digits, upper case): '$want'"
            exit 1
          fi
          if [ -z "$GPG_SIGNING_KEY" ]; then
            if [ -n "$want" ]; then
              echo "::error::The secret GPG_SIGNING_KEY isn't set, but this tag's site/install pins the release key $want: Linux installs with gpg refuse this release until SHA256SUMS.asc is up. Add the secret to the release environment and re-run this job."
              exit 1
            fi
            echo "::warning::The secret GPG_SIGNING_KEY isn't set, so SHA256SUMS isn't signed: this release has no SHA256SUMS.asc."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME" "$RUNNER_TEMP/gnupg-check"
          trap 'gpgconf --kill gpg-agent; GNUPGHOME="$RUNNER_TEMP/gnupg-check" gpgconf --kill all; rm -rf "$GNUPGHOME" "$RUNNER_TEMP/gnupg-check"' EXIT
          printf '%s\n' "$GPG_SIGNING_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ -z "$fpr" ]; then echo "::error::GPG_SIGNING_KEY holds no secret key"; exit 1; fi
          if [ -n "$want" ] && [ "$fpr" != "$want" ]; then
            echo "::error::GPG_SIGNING_KEY is the key $fpr, but this tag's site/install trusts $want: Linux installs would refuse its signature. Nothing was signed."
            exit 1
          fi
          if [ -z "$want" ]; then echo "::notice::This tag's site/install doesn't pin a release key yet (TODO-owner): installs don't check this signature."; fi
          sign=(gpg --batch --local-user "$fpr" --armor --detach-sign --output SHA256SUMS.asc)
          if [ -n "$GPG_SIGNING_KEY_PASSPHRASE" ]; then
            printf '%s' "$GPG_SIGNING_KEY_PASSPHRASE" | "${sign[@]}" --pinentry-mode loopback --passphrase-fd 0 SHA256SUMS
          else
            "${sign[@]}" SHA256SUMS
          fi
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          if [ -n "$want" ]; then
            # As the installer checks it: a keyring holding only its GPG_PUBLIC_KEY, a VALIDSIG by $want.
            awk -v q="'" '
              !on && index($0, "GPG_PUBLIC_KEY=" q) == 1 { on = 1; $0 = substr($0, 17) }
              on { if (substr($0, length($0)) == q) { print substr($0, 1, length($0) - 1); exit } print }' "$INSTALL" > "$RUNNER_TEMP/release-key.asc"
            GNUPGHOME="$RUNNER_TEMP/gnupg-check" gpg --batch --quiet --import "$RUNNER_TEMP/release-key.asc" \
              || { echo "::error::The GPG_PUBLIC_KEY in this tag's site/install can't be read"; exit 1; }
            GNUPGHOME="$RUNNER_TEMP/gnupg-check" gpg --batch --status-fd 1 --verify SHA256SUMS.asc SHA256SUMS 2>/dev/null \
              | awk -v f="$want" '$1 == "[GNUPG:]" && $2 == "VALIDSIG" && ($3 == f || $NF == f) { ok = 1 } END { exit !ok }' \
              || { echo "::error::The signature doesn't check with the GPG_PUBLIC_KEY in this tag's site/install"; exit 1; }
          fi
          echo "Signed SHA256SUMS with $fpr"
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.asc --clobber --repo "$GITHUB_REPOSITORY"
      # publish left it for here once the release key is pinned: Latest only with its signature up.
      - name: Make it the Latest release
        if: needs.publish.outputs.latest-at-end == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --latest --repo "$GITHUB_REPOSITORY"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME isn't the Latest release (Latest is ${latest:-none}), so the install command and the updater don't see it: mark it as Latest in the release's settings"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is the Latest release."

  # ---------------------------------------------------------------- breakpatch-ci (after the app)

  ci-linux:
    name: breakpatch-ci, Linux x86_64
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: breakpatch
          persist-credentials: false
      - name: Check out the Team module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.TEAM_REPO || 'BreakPatch/breakpatch-team' }}
          ref: ${{ vars.TEAM_REF || 'main' }}
          token: ${{ secrets.TEAM_REPO_TOKEN }}
          path: breakpatch-team
          persist-credentials: false
      # No caches on a tag build (security review S5).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: vars.CI_MANYLINUX == 'off'
        with:
          python-version: "3.11"
      # In the manylinux_2_28 container: both phases of build-ci.sh (the hashed locks and
      # Nuitka's downloads first, then the build, which downloads nothing), no secret inside.
      - name: Build breakpatch-ci (manylinux_2_28 container)
        if: vars.CI_MANYLINUX != 'off'
        env:
          TEAM_DIR: breakpatch-team
          MANYLINUX_IMAGE: ${{ vars.MANYLINUX_X64_IMAGE || 'quay.io/pypa/manylinux_2_28_x86_64' }}
        run: bash breakpatch/scripts/build-manylinux.sh ci --release --out "$RUNNER_TEMP/ci"
      - name: Install dependencies (hashed locks, no secrets)
        if: vars.CI_MANYLINUX == 'off'
        env:
          TEAM_DIR: breakpatch-team
        run: bash breakpatch/scripts/build-ci.sh --deps-only
      - name: Build breakpatch-ci
        if: vars.CI_MANYLINUX == 'off'
        env:
          TEAM_DIR: breakpatch-team
        run: bash breakpatch/scripts/build-ci.sh --no-deps --release --out "$RUNNER_TEMP/ci"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakpatch-ci-linux-x86_64
          path: ${{ runner.temp }}/ci
          if-no-files-found: error
          retention-days: 3

  ci-macos:
    name: breakpatch-ci, macOS arm64
    needs: ci-linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15 # Apple Silicon
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: breakpatch
          persist-credentials: false
      - name: Check out the Team module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.TEAM_REPO || 'BreakPatch/breakpatch-team' }}
          ref: ${{ vars.TEAM_REF || 'main' }}
          token: ${{ secrets.TEAM_REPO_TOKEN }}
          path: breakpatch-team
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # The Linux job's engine wheel, so both requirements files name the same file and hash.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: breakpatch-ci-linux-x86_64
          path: ${{ runner.temp }}/linux
      - name: Install dependencies (hashed locks, no secrets)
        env:
          TEAM_DIR: breakpatch-team
        run: bash breakpatch/scripts/build-ci.sh --deps-only
      - name: Build breakpatch-ci
        env:
          TEAM_DIR: breakpatch-team
        run: |
          wheel=$(ls "$RUNNER_TEMP"/linux/breakpatch_engine-*.whl)
          bash breakpatch/scripts/build-ci.sh --no-deps --release --engine-wheel "$wheel" --out "$RUNNER_TEMP/ci"
          rm "$RUNNER_TEMP"/ci/breakpatch_engine-*.whl     # published once, from the Linux job
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakpatch-ci-macos-arm64
          path: ${{ runner.temp }}/ci
          if-no-files-found: error
          retention-days: 3

  ci-linux-arm64:
    name: breakpatch-ci, Linux arm64 (and Raspberry Pi)
    needs: ci-linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: breakpatch
          persist-credentials: false
      - name: Check out the Team module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.TEAM_REPO || 'BreakPatch/breakpatch-team' }}
          ref: ${{ vars.TEAM_REF || 'main' }}
          token: ${{ secrets.TEAM_REPO_TOKEN }}
          path: breakpatch-team
          persist-credentials: false
      # The Linux x86_64 job's engine wheel, so every requirements file names the same one.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: breakpatch-ci-linux-x86_64
          path: ${{ runner.temp }}/linux
      - name: Build breakpatch-ci (manylinux_2_28 container)
        env:
          TEAM_DIR: breakpatch-team
          MANYLINUX_IMAGE: ${{ vars.MANYLINUX_ARM64_IMAGE || 'quay.io/pypa/manylinux_2_28_aarch64' }}
        run: |
          wheel=$(ls "$RUNNER_TEMP"/linux/breakpatch_engine-*.whl)
          bash breakpatch/scripts/build-manylinux.sh ci --release --engine-wheel "$wheel" --out "$RUNNER_TEMP/ci"
          rm "$RUNNER_TEMP"/ci/breakpatch_engine-*.whl     # published once, from the Linux x86_64 job
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakpatch-ci-linux-arm64
          path: ${{ runner.temp }}/ci
          if-no-files-found: error
          retention-days: 3

  ci-windows-x64:
    name: breakpatch-ci, Windows x64 (preview)
    needs: ci-linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release
    defaults:
      run:
        shell: bash   # Git Bash: the same scripts as on Linux and macOS
    env:
      PYTHON: python  # setup-python's 3.11, for the build venv (engine/.venv/Scripts/python.exe)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: breakpatch
          persist-credentials: false
      - name: Check out the Team module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.TEAM_REPO || 'BreakPatch/breakpatch-team' }}
          ref: ${{ vars.TEAM_REF || 'main' }}
          token: ${{ secrets.TEAM_REPO_TOKEN }}
          path: breakpatch-team
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: breakpatch-ci-linux-x86_64
          path: ${{ runner.temp }}/linux
      - name: Install dependencies (hashed locks, no secrets)
        env:
          TEAM_DIR: breakpatch-team
        run: bash breakpatch/scripts/build-ci.sh --deps-only
      - name: Build breakpatch-ci
        env:
          TEAM_DIR: breakpatch-team
        run: |
          wheel=$(ls "$RUNNER_TEMP"/linux/breakpatch_engine-*.whl)
          bash breakpatch/scripts/build-ci.sh --no-deps --release --engine-wheel "$wheel" --out "$RUNNER_TEMP/ci"
          rm "$RUNNER_TEMP"/ci/breakpatch_engine-*.whl     # published once, from the Linux x86_64 job
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakpatch-ci-windows-x86_64
          path: ${{ runner.temp }}/ci
          if-no-files-found: error
          retention-days: 3

  publish-ci:
    name: Publish breakpatch-ci
    # After publish-linux too, which also rewrites SHA256SUMS: one at a time, so neither loses
    # the other's lines. Its result doesn't matter here.
    needs: [ci-linux, ci-macos, ci-linux-arm64, ci-windows-x64, publish-linux]
    # The Linux x86_64 files are enough to publish; the others are added when their job worked.
    if: ${{ !cancelled() && needs.ci-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # adds files to the release made by publish
    steps:
      # Only for the scripts below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: breakpatch
          persist-credentials: false
          sparse-checkout: |
            scripts/check-ci-requirements.sh
            scripts/release-add-files.sh
            scripts/release-put-sums.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: breakpatch-ci-linux-x86_64
          path: ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.ci-macos.result == 'success'
        with:
          name: breakpatch-ci-macos-arm64
          path: ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.ci-linux-arm64.result == 'success'
        with:
          name: breakpatch-ci-linux-arm64
          path: ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.ci-windows-x64.result == 'success'
        with:
          name: breakpatch-ci-windows-x86_64
          path: ci
      # SHA256SUMS: the release's own (the app's lines stay as they are) merged with a line per
      # new file from every platform that was built. Safe to re-run: a name already in it must
      # have the same SHA-256 (then it's uploaded again with --clobber), and another file under
      # it fails the job (scripts/release-add-files.sh). Every requirements file must name the
      # two wheels, with LF line endings, and each must be here with the hash it gives
      # (scripts/check-ci-requirements.sh).
      - name: Check and publish
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS: ${{ needs.ci-macos.result }}
          ARM64: ${{ needs.ci-linux-arm64.result }}
          WINDOWS: ${{ needs.ci-windows-x64.result }}
        run: |
          for p in "macOS:$MACOS" "Linux arm64:$ARM64" "Windows x64:$WINDOWS"; do
            if [ "${p##*:}" != success ]; then
              echo "::warning::breakpatch-ci for ${p%:*} wasn't built (${p##*:}); it isn't in this release."
            fi
          done
          bash breakpatch/scripts/check-ci-requirements.sh ci
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir old
          bash breakpatch/scripts/release-add-files.sh old/SHA256SUMS ci merged
          cat merged/SHA256SUMS
          mapfile -t files < merged/upload.txt
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          # Only when SHA256SUMS changes, and then without the old SHA256SUMS.asc.
          bash breakpatch/scripts/release-put-sums.sh old/SHA256SUMS merged/SHA256SUMS

  # ---------------------------------------------------------------- after breakpatch-ci is published

  # The published release, installed as a customer installs it, in clean containers: the install
  # command from this tag, then the system libraries, then setup and a run without a licence
  # (exit 3). No secrets: the release is read with this run's own token (the repository may still
  # be private). A failure here doesn't undo the release; it says the install is broken.
  smoke-ci-linux:
    name: breakpatch-ci install, ${{ matrix.image }} (${{ matrix.arch }})
    needs: [publish-ci, ci-linux-arm64]
    if: ${{ !cancelled() && needs.publish-ci.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
        # arm64 only when its breakpatch-ci was built and published.
        arch: ${{ fromJSON(needs.ci-linux-arm64.result == 'success' && '["x86_64", "arm64"]' || '["x86_64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    steps:
      - name: curl (the images have none)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: site/install-ci
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install, add the libraries, set up, run
        env:
          BREAKPATCH_GITHUB_TOKEN: ${{ github.token }}
        run: |
          BREAKPATCH_VERSION=${GITHUB_REF_NAME#v} sh site/install-ci
          export PATH="$HOME/.local/bin:$PATH"
          "$HOME/.breakpatch-ci/current/bin/python" -m playwright install-deps chromium
          breakpatch-ci setup
          echo '{"name": "smoke", "startUrl": "about:blank", "steps": []}' > smoke.json
          code=0; breakpatch-ci run --test smoke.json || code=$?
          if [ "$code" -ne 3 ]; then echo "::error::without a licence key breakpatch-ci run should exit 3, not $code"; exit 1; fi
          sh site/install-ci --uninstall

  # ghcr.io/breakpatch/ci:<version> (docker/ci/Dockerfile), linux/amd64 and linux/arm64, each built
  # on a machine of its kind (no emulation) from the published release, pushed by digest, then
  # joined into one multi-arch tag by ci-image. Tag runs only; nothing here runs on a pull request.
  # Plain docker and buildx commands (on the runner image), so no third-party action holds the
  # package token. `latest` moves only on a stable release. arm64 is left out when its
  # breakpatch-ci wasn't built.
  ci-image-build:
    name: Container image, ${{ matrix.platform }}
    needs: [publish-ci, ci-linux-arm64]
    if: ${{ !cancelled() && needs.publish-ci.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 only when its breakpatch-ci was built and published.
        include: >-
          ${{ fromJSON(needs.ci-linux-arm64.result == 'success'
          && '[{"platform": "linux/amd64", "runner": "ubuntu-24.04", "name": "amd64"}, {"platform": "linux/arm64", "runner": "ubuntu-24.04-arm", "name": "arm64"}]'
          || '[{"platform": "linux/amd64", "runner": "ubuntu-24.04", "name": "amd64"}]') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read     # the release's files (the repository may be private)
      packages: write    # pushes to ghcr.io/breakpatch/ci
    env:
      IMAGE: ghcr.io/breakpatch/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The base image and the Dockerfile frontend must be pinned by digest: a moved tag would
      # go straight into the published image. This job never runs before publish-ci, so it can't
      # hold up the app or breakpatch-ci (test-release-merge.sh checks nothing they need waits on it).
      - name: Base image and frontend pinned
        env:
          BASE: ${{ vars.CI_IMAGE_BASE || 'ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55' }}
        run: |
          if [[ "$BASE" != *@sha256:* ]]; then
            echo "::error::The repository variable CI_IMAGE_BASE must name the base image by digest (ubuntu:24.04@sha256:…), not '${BASE:-unset}': the container image isn't built."
            exit 1
          fi
          if ! head -n 1 docker/ci/Dockerfile | grep -Eq '^# syntax=[^ ]+@sha256:[0-9a-f]{64}$'; then
            echo "::error::docker/ci/Dockerfile's syntax line must pin the frontend by digest"
            exit 1
          fi
      # No token goes into the build (the repository is public); the one that can push to ghcr.io
      # is used by docker login and buildx's push only, never by a RUN.
      - name: Build and push by digest
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          BASE: ${{ vars.CI_IMAGE_BASE || 'ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55' }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build . -f docker/ci/Dockerfile --platform "$PLATFORM" \
            --build-arg "BREAKPATCH_VERSION=${GITHUB_REF_NAME#v}" --build-arg "BASE=$BASE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json"
          mkdir -p "$RUNNER_TEMP/digests"
          digest=$(sed -n 's/.*"containerimage.digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' "$RUNNER_TEMP/metadata.json" | head -n 1)
          [ -n "$digest" ] || { echo "::error::no digest in the build's metadata"; exit 1; }
          echo "$digest" > "$RUNNER_TEMP/digests/${{ matrix.name }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-image-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

  ci-image:
    name: Container image (multi-arch tag)
    # After sign-sums too: once the release key is pinned, the release becomes Latest there, and
    # `latest` follows the Latest release. Its result doesn't matter here.
    needs: [ci-image-build, sign-sums]
    if: ${{ !cancelled() && needs.ci-image-build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read     # asks which release is Latest (the repository may be private)
      packages: write
    env:
      IMAGE: ghcr.io/breakpatch/ci
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-image-digest-*
          merge-multiple: true
          path: digests
      - name: Tag the version (and latest, when this is the Latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          [ -f digests/amd64 ] || { echo "::error::the amd64 image wasn't built"; exit 1; }
          if [ ! -f digests/arm64 ]; then echo "::warning::the arm64 image wasn't built; the tag is amd64 only."; fi
          version=${GITHUB_REF_NAME#v}
          tags=(-t "$IMAGE:$version")
          # `latest` follows GitHub's Latest release: never a prerelease, nor a fix to an older
          # version released after a newer one.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          case "$version" in
            *-*) echo "A prerelease: $IMAGE:latest stays where it is." ;;
            *)
              if [ "$latest" = "$GITHUB_REF_NAME" ]; then tags+=(-t "$IMAGE:latest")
              else echo "::notice::$GITHUB_REF_NAME isn't the Latest release (${latest:-none}): $IMAGE:latest stays where it is."
              fi ;;
          esac
          refs=()
          for f in digests/*; do refs+=("$IMAGE@$(cat "$f")"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"

  test-build:
    name: macOS arm64 (unsigned Community test build)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
      ENGINE_EXTRAS: dev,mlx
      PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      # Caches are fine here (tag builds never restore them).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - name: Install dependencies
        run: bash scripts/build-release.sh --target "$TARGET" --deps-only
      # No signing secrets: ad-hoc signed (hardened runtime on), no update archive.
      - name: Build (unsigned)
        run: bash scripts/build-release.sh --target "$TARGET" --bundles app,dmg --no-deps
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakpatch-community-test-macos-arm64
          path: app/src-tauri/target/${{ env.TARGET }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 3

  test-build-linux:
    name: Linux x64 (unsigned Community test build)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # The release job's container, with no secrets at all: tries the Linux bundles before a tag.
    container:
      image: ${{ vars.UBUNTU_2204_IMAGE || 'ubuntu:22.04' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"
      PYTHON: python
    defaults:
      run:
        shell: bash
    steps:
      - name: System packages (Ubuntu 22.04)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git lsb-release build-essential pkg-config file patchelf \
            xdg-utils desktop-file-utils shared-mime-info \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.98.1
      - name: Install dependencies
        run: bash scripts/build-release.sh --deps-only
      # No updater key: no .sig files and no latest-linux.json entries.
      - name: Build (unsigned)
        run: bash scripts/build-release.sh --bundles deb,appimage --no-deps
      - name: Check the bundles
        id: files
        run: |
          version=$(node -p "require('./app/package.json').version")
          bash scripts/linux-release-files.sh --version "$version" app/src-tauri/target/release/bundle "$RUNNER_TEMP/linux"
          echo "dir=$RUNNER_TEMP/linux" >> "$GITHUB_OUTPUT"   # the container's path, not runner.temp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakpatch-community-test-linux-x64
          path: ${{ steps.files.outputs.dir }}
          if-no-files-found: error
          retention-days: 3
