<!doctype html>
<!-- The social preview (site/assets/og.png, 1200 × 630). Rendered by scripts/og/render.py:
     edit the words here, then run it. Keep it to what Community does today.
     The screenshot is the whole recorder, cropped above its bottom bar: the steps, the New project
     button just clicked, and "Click New project?" with Confirm, so it reads as the moment the AI
     names a step, not as a greyed-out page. Nothing at its edges is cut (Save, the steps). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#171412;--text:#F4EEE9;--soft:#C9BDB3;--line:#3A322C;--accent:#E0714A;--accent-soft:rgba(224,113,74,.13)}
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--text);background:radial-gradient(900px 500px at 85% 0%,#3a2418 0%,var(--bg) 60%);-webkit-font-smoothing:antialiased}
  .text{position:absolute;left:60px;top:64px;width:360px}
  .brand{display:flex;align-items:center;gap:12px;font-size:34px;letter-spacing:-.01em}
  .brand b{font-weight:700}
  .ear{width:36px;height:36px;background:var(--accent);border-radius:22px 5px 22px 22px;transform:rotate(-14deg)}
  .badge{display:inline-flex;align-items:center;gap:9px;margin-top:30px;padding:7px 16px;border:1.5px solid rgba(224,113,74,.45);background:var(--accent-soft);border-radius:999px;font-size:17px;font-weight:500}
  .badge svg{width:18px;height:18px;fill:var(--accent)}
  h1{margin:22px 0 0;font-size:50px;line-height:1.02;letter-spacing:-.03em;font-weight:700}
  h1 em{font-style:normal;color:var(--accent)}
  p{margin:20px 0 0;font-size:20px;line-height:1.4;color:var(--soft)}
  .free{margin-top:18px;font-size:20px;font-weight:600;color:var(--accent)}
  /* The recorder at 0.58 of its size, its top 712 px (of 800): down to just under the Confirm bar. */
  .shot{position:absolute;left:446px;top:108px;width:744px;height:414px;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .shot img{display:block;width:744px}
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><span class="ear"></span><span><b>break</b>patch</span></div>
    <div class="badge"><svg viewBox="0 0 24 24"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>Your screens never leave your Mac</div>
    <h1>UI testing that <em>runs on your Mac.</em></h1>
    <p>Click through your web app. The AI names each step. Replay it and see what broke. No code.</p>
    <div class="free">Free and open source.</div>
  </div>
  <div class="shot"><img src="../../site/assets/shots/recorder-dark@2x.webp" alt=""></div>
</body>
</html>
