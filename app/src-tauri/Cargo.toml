[package]
name = "breakpatch"
version = "0.1.0-beta.1"
description = "Breakpatch desktop app"
authors = ["Breakpatch contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "breakpatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
# The licence keys are written masked into OUT_DIR (build.rs, src/licence_embed.rs).
base64 = "0.22"
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# "watch": the local tests folder picks up outside edits (git pull) as they happen.
tauri-plugin-fs = { version = "2", features = ["watch"] }
# Keeps the tests folders picked in the dialog in the fs scope across restarts.
tauri-plugin-persisted-scope = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
# Local notifications when a run or suite finishes while the window is in the background.
tauri-plugin-notification = "2"
# Paste buttons read the clipboard through the shell: WebKit's navigator.clipboard.readText()
# shows a "Paste" confirmation bubble first.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
log = "0.4"
url = "2"
reqwest = { version = "0.13", features = ["json"] }
# The OS credential store (secrets.rs) is per platform: see the [target.…dependencies] below.
# Licence tokens (licence.rs): Ed25519 JWS checked offline against keys built in at compile time.
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
# Workspace keys (workspace_keys.rs): test content sealed on the Mac with the workspace data key.
chacha20poly1305 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
# Upgrade to Team moves the copied tests folder to the Trash (migration.rs; the Recycle Bin on
# Windows), so Put Back (Restore) undoes it.
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Keychain on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# The Secret Service over D-Bus on Linux (GNOME Keyring, KWallet): zbus is pure Rust, so there's
# no libdbus to build against, and async-io runs its own executor, so it can be called from any
# thread, tokio's or not. Not the kernel keyring (linux-native): it doesn't survive a reboot.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }

# Credential Manager on Windows: 2,560 bytes a credential, so secrets.rs splits longer values.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

# Anywhere else (a BSD, say) the shell still builds, with keyring's in-memory store.
[target.'cfg(not(any(target_os = "macos", target_os = "linux", windows)))'.dependencies]
keyring = "3"

# Show in folder on Windows (explorer /select,) and Linux (FileManager1.ShowItems, with a
# fallback). macOS keeps `open -R` (folder.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "test-util", "net", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
